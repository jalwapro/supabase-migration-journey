<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <radialGradient id="fp-core" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff2a8" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#ff8a00" stop-opacity=".6"/>
      <stop offset="1" stop-color="#ff0033" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fp-ring" x1="0" x2="1">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset=".5" stop-color="#ff6a00"/>
      <stop offset="1" stop-color="#c40000"/>
    </linearGradient>
  </defs>
  <g transform="translate(150 150)">
    <circle r="140" fill="url(#fp-core)">
      <animate attributeName="r" values="130;150;130" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
      <circle r="120" fill="none" stroke="url(#fp-ring)" stroke-width="5"/>
    </g>
    <!-- flame tongues -->
    <g fill="url(#fp-ring)" opacity=".9">
      <path d="M-18 -122 Q0 -155 18 -122 Q0 -135 -18 -122 Z">
        <animate attributeName="d" values="M-18 -122 Q0 -155 18 -122 Q0 -135 -18 -122 Z;M-18 -122 Q0 -170 18 -122 Q0 -140 -18 -122 Z;M-18 -122 Q0 -155 18 -122 Q0 -135 -18 -122 Z" dur=".9s" repeatCount="indefinite"/>
      </path>
      <path d="M108 -60 Q140 -50 118 -30 Q120 -50 108 -60 Z">
        <animate attributeName="opacity" values=".6;1;.6" dur="1.1s" repeatCount="indefinite"/>
      </path>
      <path d="M-108 -60 Q-140 -50 -118 -30 Q-120 -50 -108 -60 Z">
        <animate attributeName="opacity" values=".8;.4;.8" dur=".9s" repeatCount="indefinite"/>
      </path>
      <path d="M118 60 Q150 70 122 90 Q125 70 118 60 Z">
        <animate attributeName="opacity" values=".5;1;.5" dur="1.3s" repeatCount="indefinite"/>
      </path>
      <path d="M-118 60 Q-150 70 -122 90 Q-125 70 -118 60 Z">
        <animate attributeName="opacity" values="1;.5;1" dur="1s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- embers -->
    <g fill="#ffcf6a">
      <circle cx="80" cy="-80" r="2"><animate attributeName="cy" values="-80;-140" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="-70" cy="-60" r="2"><animate attributeName="cy" values="-60;-130" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="20" cy="-90" r="1.5"><animate attributeName="cy" values="-90;-160" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.8s" repeatCount="indefinite"/></circle>
    </g>
  </g>
</svg>
