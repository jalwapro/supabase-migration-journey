<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="rg-gold" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff5c2"/>
      <stop offset=".5" stop-color="#f5c518"/>
      <stop offset="1" stop-color="#8a5a00"/>
    </linearGradient>
    <radialGradient id="rg-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffe27a" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffe27a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g transform="translate(150 150)">
    <circle r="128" fill="url(#rg-glow)">
      <animate attributeName="r" values="120;138;120" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".55;.9;.55" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
      <circle r="118" fill="none" stroke="url(#rg-gold)" stroke-width="6" stroke-dasharray="4 8"/>
      <circle r="128" fill="none" stroke="url(#rg-gold)" stroke-width="2" opacity=".6"/>
    </g>
    <!-- crown -->
    <g transform="translate(0 -118)">
      <path d="M-42 8 L-30 -22 L-15 4 L0 -30 L15 4 L30 -22 L42 8 Z" fill="url(#rg-gold)" stroke="#7a4a00" stroke-width="1.5"/>
      <circle cx="0" cy="-30" r="4" fill="#fff"/>
      <circle cx="-30" cy="-22" r="3" fill="#ffd1e8"/>
      <circle cx="30" cy="-22" r="3" fill="#c0f0ff"/>
      <animateTransform attributeName="transform" type="translate" values="0,-118; 0,-124; 0,-118" dur="2s" repeatCount="indefinite"/>
    </g>
    <!-- sparkles -->
    <g fill="#fff">
      <circle cx="-90" cy="-40" r="2"><animate attributeName="opacity" values="0;1;0" dur="1.4s" repeatCount="indefinite"/></circle>
      <circle cx="95" cy="20" r="2.5"><animate attributeName="opacity" values="0;1;0" dur="1.4s" begin=".4s" repeatCount="indefinite"/></circle>
      <circle cx="-60" cy="80" r="2"><animate attributeName="opacity" values="0;1;0" dur="1.4s" begin=".8s" repeatCount="indefinite"/></circle>
      <circle cx="70" cy="-70" r="2"><animate attributeName="opacity" values="0;1;0" dur="1.4s" begin="1.1s" repeatCount="indefinite"/></circle>
    </g>
  </g>
</svg>
