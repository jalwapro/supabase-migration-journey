<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#5b21b6"/><stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#facc15"/><stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- rotating rays -->
  <g transform="translate(200 150)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
      <g stroke="#facc15" stroke-width="1" opacity="0.3">
        <line x1="0" y1="0" x2="0" y2="-200"/>
        <line x1="0" y1="0" x2="141" y2="-141"/>
        <line x1="0" y1="0" x2="200" y2="0"/>
        <line x1="0" y1="0" x2="141" y2="141"/>
        <line x1="0" y1="0" x2="0" y2="200"/>
        <line x1="0" y1="0" x2="-141" y2="141"/>
        <line x1="0" y1="0" x2="-200" y2="0"/>
        <line x1="0" y1="0" x2="-141" y2="-141"/>
      </g>
    </g>
    <circle r="70" fill="url(#sun)">
      <animate attributeName="r" values="60;80;60" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- floating particles -->
  <g fill="#fff">
    <circle cx="60" cy="60" r="1.5"><animate attributeName="cy" from="80" to="20" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="250" r="2"><animate attributeName="cy" from="260" to="180" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="240" r="1.5"><animate attributeName="cy" from="260" to="180" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="80" r="1.5"><animate attributeName="cy" from="100" to="40" dur="3s" repeatCount="indefinite"/></circle>
  </g>
</svg>
