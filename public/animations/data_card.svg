<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#1e1b4b"/><stop offset="1" stop-color="#0a0018"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset=".5" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <g transform="translate(200 150)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-14;14;-14" dur="5s" repeatCount="indefinite"/>
      <!-- card -->
      <rect x="-130" y="-80" width="260" height="160" rx="16" fill="url(#card)" stroke="#fff5" stroke-width="1.5"/>
      <!-- shine sweep -->
      <rect x="-130" y="-80" width="260" height="160" rx="16" fill="url(#shine)" opacity="0.9">
        <animate attributeName="x" from="-260" to="130" dur="2.5s" repeatCount="indefinite"/>
      </rect>
      <!-- chip -->
      <rect x="-100" y="-40" width="50" height="38" rx="4" fill="#fde68a" stroke="#78350f" stroke-width="1"/>
      <rect x="-96" y="-36" width="42" height="6" fill="#78350f"/>
      <rect x="-96" y="-24" width="42" height="4" fill="#78350f"/>
      <rect x="-96" y="-14" width="42" height="4" fill="#78350f"/>
      <text x="-100" y="30" font-family="sans-serif" font-weight="900" font-size="18" fill="#fff">JALWA VIP</text>
      <text x="-100" y="52" font-family="monospace" font-weight="700" font-size="14" fill="#fffc">**** 8888</text>
      <text x="65" y="70" font-family="sans-serif" font-weight="800" font-size="10" fill="#fff">GOLD</text>
    </g>
  </g>
</svg>
