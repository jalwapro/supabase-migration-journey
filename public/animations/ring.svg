<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <radialGradient id="bg" cx=".5" cy=".5" r=".7">
      <stop offset="0" stop-color="#4a0e2e"/><stop offset="1" stop-color="#0a0006"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff5c2"/>
      <stop offset=".5" stop-color="#fde047"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="gem" cx=".3" cy=".3" r=".8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".4" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#831843"/>
    </radialGradient>
  </defs>
  <rect width="300" height="300" fill="url(#bg)"/>
  <!-- sparkles -->
  <g fill="#fff">
    <circle cx="60" cy="60" r="1.5"><animate attributeName="opacity" values="0;1;0" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="240" cy="80" r="2"><animate attributeName="opacity" values="1;0;1" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="230" r="1.5"><animate attributeName="opacity" values="0;1;0" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="70" cy="240" r="1.5"><animate attributeName="opacity" values="1;0;1" dur="1.4s" repeatCount="indefinite"/></circle>
  </g>
  <g transform="translate(150 170)">
    <animateTransform attributeName="transform" type="translate"
      values="150,170; 150,150; 150,170" keyTimes="0;0.5;1" dur="2.4s" repeatCount="indefinite" additive="replace"/>
    <!-- ring band -->
    <ellipse rx="70" ry="72" fill="none" stroke="url(#gold)" stroke-width="14"/>
    <ellipse rx="70" ry="72" fill="none" stroke="#fff" stroke-width="1" opacity="0.6"/>
    <!-- diamond gem on top -->
    <g transform="translate(0 -72)">
      <polygon points="0,-30 25,-6 18,26 -18,26 -25,-6" fill="url(#gem)" stroke="#fff" stroke-width="1.5"/>
      <polygon points="0,-30 25,-6 -25,-6" fill="#fff" opacity="0.4"/>
      <!-- pulse glow -->
      <circle r="26" fill="#f472b6" opacity="0">
        <animate attributeName="r" values="18;38;18" dur="1.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0;0.6" dur="1.4s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</svg>
