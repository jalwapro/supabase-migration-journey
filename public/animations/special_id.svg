<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#3b0764"/><stop offset="1" stop-color="#0a0018"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" x2="1">
      <stop offset="0" stop-color="#facc15"/>
      <stop offset=".5" stop-color="#fff5c2"/>
      <stop offset="1" stop-color="#a16207"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- glow orbs -->
  <g>
    <circle cx="80" cy="80" r="40" fill="#facc15" opacity="0.15">
      <animate attributeName="r" values="30;50;30" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="330" cy="220" r="50" fill="#a855f7" opacity="0.15">
      <animate attributeName="r" values="40;60;40" dur="3s" begin="1s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="200" y="180" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="120" letter-spacing="8"
        fill="url(#shine)" stroke="#fff" stroke-width="1">
    8888
    <animate attributeName="opacity" values="0.85;1;0.85" dur="1.6s" repeatCount="indefinite"/>
  </text>
  <text x="200" y="230" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="16" fill="#fde047" opacity="0.9">
    ★ RARE ID ★
  </text>
  <!-- sparkles -->
  <g fill="#fff">
    <circle cx="120" cy="100" r="2"><animate attributeName="opacity" values="0;1;0" dur="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="280" cy="80" r="1.5"><animate attributeName="opacity" values="1;0;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="200" r="2"><animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/></circle>
  </g>
</svg>
