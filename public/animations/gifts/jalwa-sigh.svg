<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="g1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff8ec4" stop-opacity="1"/>
      <stop offset="45%" stop-color="#ff8ec4" stop-opacity="0.55"/>
      <stop offset="80%" stop-color="#ffd166" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#ffd166" stop-opacity="0"/>
      <stop offset="85%" stop-color="#ffd166" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
    <filter id="b1"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  
  <circle cx="200" cy="200" r="180" fill="url(#g1)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <g font-size="16" text-anchor="middle">
    <text x="90" y="130" fill="#ff8ec4">💗<animate attributeName="y" values="130;100;130" dur="2.4s" repeatCount="indefinite"/></text>
    <text x="310" y="150" fill="#ffd166">💗<animate attributeName="y" values="150;115;150" dur="2.6s" repeatCount="indefinite"/></text>
    <text x="80" y="300" fill="#ff8ec4">💗<animate attributeName="y" values="300;270;300" dur="2.2s" repeatCount="indefinite"/></text>
    <text x="320" y="290" fill="#ffd166">💗<animate attributeName="y" values="290;260;290" dur="2.8s" repeatCount="indefinite"/></text>
  </g>
  
  
  
  <text x="200" y="245" font-size="184" text-anchor="middle" dominant-baseline="middle">🍫
    <animateTransform attributeName="transform" type="scale" values="1;1.08;1" dur="1.6s" repeatCount="indefinite" additive="sum"/>
    <animate attributeName="y" values="245;235;245" dur="1.6s" repeatCount="indefinite"/>
  </text>
</svg>