<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="lrBg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ffd54a" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#ff8a00" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3b0f00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lrMane">
      <stop offset="0%" stop-color="#ffe27a"/>
      <stop offset="60%" stop-color="#e07800"/>
      <stop offset="100%" stop-color="#6b2b00"/>
    </radialGradient>
    <filter id="lrGlow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <circle cx="200" cy="200" r="200" fill="url(#lrBg)">
    <animate attributeName="r" values="140;220;170" dur="1.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;1;0.6" dur="1.4s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(200 200)" filter="url(#lrGlow)">
    <g stroke="#ffe27a" fill="none" stroke-width="3" opacity="0.85">
      <circle r="60">
        <animate attributeName="r" values="60;190" dur="1.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <circle r="60">
        <animate attributeName="r" values="60;190" dur="1.6s" begin="0.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="1.6s" begin="0.4s" repeatCount="indefinite"/>
      </circle>
      <circle r="60">
        <animate attributeName="r" values="60;190" dur="1.6s" begin="0.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="1.6s" begin="0.8s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <g transform="translate(200 200)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0;-4;4;-3;0" dur="0.6s" repeatCount="indefinite"/>
    <circle r="105" fill="url(#lrMane)" stroke="#3b0f00" stroke-width="3">
      <animate attributeName="r" values="100;115;100" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <g fill="#e07800" stroke="#6b2b00" stroke-width="2">
      <circle cx="-90" cy="-50" r="18"/><circle cx="-100" cy="0" r="20"/><circle cx="-90" cy="50" r="18"/>
      <circle cx="90" cy="-50" r="18"/><circle cx="100" cy="0" r="20"/><circle cx="90" cy="50" r="18"/>
      <circle cx="0" cy="-100" r="18"/><circle cx="-55" cy="-90" r="16"/><circle cx="55" cy="-90" r="16"/>
      <circle cx="0" cy="100" r="18"/>
    </g>
    </g>
    <text x="0" y="35" font-size="140" text-anchor="middle" dominant-baseline="middle">🦁
      <animateTransform attributeName="transform" type="scale" values="1;1.12;1" dur="0.6s" repeatCount="indefinite" additive="sum"/>
    </text>
  </g>

  <g fill="#fff9c9" font-size="18" font-weight="bold" font-family="Arial Black, sans-serif">
    <text x="200" y="60" text-anchor="middle" opacity="0" fill="#fff">👑 KING 👑
      <animate attributeName="opacity" values="0;1;1;0" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="font-size" values="12;28;22" dur="1.8s" repeatCount="indefinite"/>
    </text>
  </g>

  <g fill="#fff">
    <circle cx="40" cy="60" r="2.5"><animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite"/></circle>
    <circle cx="360" cy="80" r="2"><animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="70" cy="350" r="2.5"><animate attributeName="opacity" values="0;1;0" dur="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="340" r="2"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></circle>
  </g>
</svg>
