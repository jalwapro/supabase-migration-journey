    <text x="70" y="220">🎆<animate attributeName="opacity" values="0;1;0" dur="1.3s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="font-size" values="18;56;18" dur="1.3s" begin="0.5s" repeatCount="indefinite"/></text>
    <text x="330" y="220">🎆<animate attributeName="opacity" values="1;0;1" dur="1.5s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="font-size" values="18;56;18" dur="1.5s" begin="0.8s" repeatCount="indefinite"/></text>
