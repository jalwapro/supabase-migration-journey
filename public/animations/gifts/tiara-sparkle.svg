    <text x="140" y="55" font-size="20">✦<animate attributeName="opacity" values="0;1;0" dur="1.3s" begin="0.3s" repeatCount="indefinite"/></text>
    <text x="155" y="160" font-size="14">✦<animate attributeName="opacity" values="0;1;0" dur="1.1s" begin="0.6s" repeatCount="indefinite"/></text>
    <text x="45" y="155" font-size="18">✦<animate attributeName="opacity" values="0;1;0" dur="1.4s" begin="0.9s" repeatCount="indefinite"/></text>
