<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="g1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff2b0" stop-opacity="1"/>
      <stop offset="45%" stop-color="#fff2b0" stop-opacity="0.55"/>
      <stop offset="80%" stop-color="#ff2ea8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#ff2ea8" stop-opacity="0"/>
      <stop offset="85%" stop-color="#ff2ea8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff2ea8" stop-opacity="0"/>
    </radialGradient>
    <filter id="b1"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  
  <circle cx="200" cy="200" r="170" fill="url(#g1)" opacity="0.8">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <g font-size="18">
    <text x="80" y="0" fill="#fff2b0">✦<animate attributeName="y" from="-20" to="400" dur="4s" repeatCount="indefinite"/></text>
    <text x="200" y="0" fill="#ff2ea8">✧<animate attributeName="y" from="-30" to="410" dur="5s" repeatCount="indefinite"/></text>
    <text x="320" y="0" fill="#fff2b0">✦<animate attributeName="y" from="-10" to="405" dur="4.5s" repeatCount="indefinite"/></text>
    <text x="140" y="0" fill="#ff2ea8">✧<animate attributeName="y" from="-40" to="410" dur="5.5s" repeatCount="indefinite"/></text>
    <text x="260" y="0" fill="#fff2b0">✦<animate attributeName="y" from="-25" to="415" dur="4.2s" repeatCount="indefinite"/></text>
  </g>
  
  <g stroke="#ff2ea8" stroke-width="2" fill="none" opacity="0.9" filter="url(#b1)">
    <polyline points="80,70 110,130 90,150 130,210">
      <animate attributeName="opacity" values="0;1;0" dur="0.6s" repeatCount="indefinite"/>
    </polyline>
    <polyline points="320,80 295,140 315,160 280,220">
      <animate attributeName="opacity" values="0;1;0" dur="0.7s" begin="0.3s" repeatCount="indefinite"/>
    </polyline>
  </g>
  
  <g font-size="18" text-anchor="middle">
    <text x="60" y="120" fill="#fff2b0">✨<animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" repeatCount="indefinite"/></text>
    <text x="340" y="140" fill="#ff2ea8">✨<animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/></text>
    <text x="70" y="290" fill="#fff2b0">✨<animate attributeName="opacity" values="0.5;1;0.5" dur="1.4s" repeatCount="indefinite"/></text>
    <text x="330" y="300" fill="#ff2ea8">✨<animate attributeName="opacity" values="1;0.5;1" dur="1.5s" repeatCount="indefinite"/></text>
  </g>
  
  <text x="200" y="245" font-size="206" text-anchor="middle" dominant-baseline="middle">🧿
    <animateTransform attributeName="transform" type="scale" values="1;1.08;1" dur="1.6s" repeatCount="indefinite" additive="sum"/>
    <animate attributeName="y" values="245;235;245" dur="1.6s" repeatCount="indefinite"/>
  </text>
</svg>