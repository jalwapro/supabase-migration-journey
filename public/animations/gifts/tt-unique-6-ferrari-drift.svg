<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="fd-road" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff2a2a" stop-opacity="0"/>
      <stop offset="60%" stop-color="#ff2a2a" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffd166" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="fd-bg" cx="50%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#ff8c8c" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff8c8c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="200" cy="220" r="200" fill="url(#fd-bg)"/>
  <g>
    <rect x="-100" y="210" width="600" height="14" fill="url(#fd-road)" opacity="0.85">
      <animate attributeName="x" values="-100;-40;-100" dur="0.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="-100" y="240" width="600" height="8" fill="url(#fd-road)" opacity="0.6">
      <animate attributeName="x" values="-40;-100;-40" dur="0.4s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="200" y="230" font-size="180" text-anchor="middle">🏎️
    <animateTransform attributeName="transform" type="translate" values="-30 0;30 0;-30 0" dur="0.8s" repeatCount="indefinite"/>
  </text>
  <g font-size="26" text-anchor="middle">
    <text x="80" y="120">💨<animate attributeName="x" values="80;340" dur="0.9s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="0.9s" repeatCount="indefinite"/></text>
    <text x="60" y="160">💨<animate attributeName="x" values="60;360" dur="1.1s" begin="0.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.1s" begin="0.2s" repeatCount="indefinite"/></text>
    <text x="90" y="300">💨<animate attributeName="x" values="90;340" dur="0.8s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="0.8s" begin="0.4s" repeatCount="indefinite"/></text>
  </g>
</svg>
