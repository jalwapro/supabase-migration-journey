<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="dfBg" cx="50%" cy="55%" r="60%">
      <stop offset="0%" stop-color="#ffdd55" stop-opacity="1"/>
      <stop offset="35%" stop-color="#ff5a00" stop-opacity="0.75"/>
      <stop offset="75%" stop-color="#8a0e00" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1a0000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dfFlame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffdd55"/>
      <stop offset="60%" stop-color="#ff5a00"/>
      <stop offset="100%" stop-color="#b30000" stop-opacity="0"/>
    </linearGradient>
    <filter id="dfBlur"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <rect width="400" height="400" fill="#180000"/>
  <circle cx="200" cy="210" r="200" fill="url(#dfBg)">
    <animate attributeName="r" values="140;230;180" dur="1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.7" dur="1.2s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(200 240)" filter="url(#dfBlur)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1 0.8;1.3 1.4;1 1" dur="0.8s" repeatCount="indefinite" additive="sum"/>
      <path d="M-80 40 Q -100 -40 -50 -80 Q -30 -30 -20 -80 Q 0 -140 20 -80 Q 30 -30 50 -80 Q 100 -40 80 40 Z" fill="url(#dfFlame)"/>
    </g>
  </g>

  <g transform="translate(200 200)">
    <text x="0" y="15" font-size="150" text-anchor="middle" dominant-baseline="middle">🐉
      <animateTransform attributeName="transform" type="rotate" values="-6;6;-6" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="font-size" values="140;165;140" dur="1s" repeatCount="indefinite"/>
    </text>
  </g>

  <g>
    <text x="80" y="380" font-size="30">🔥
      <animate attributeName="y" values="380;-40" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0" dur="2.4s" repeatCount="indefinite"/>
    </text>
    <text x="160" y="380" font-size="26">🔥
      <animate attributeName="y" values="380;-40" dur="2s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0" dur="2s" begin="0.3s" repeatCount="indefinite"/>
    </text>
    <text x="240" y="380" font-size="32">🔥
      <animate attributeName="y" values="380;-40" dur="2.6s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0" dur="2.6s" begin="0.6s" repeatCount="indefinite"/>
    </text>
    <text x="320" y="380" font-size="28">🔥
      <animate attributeName="y" values="380;-40" dur="2.2s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0" dur="2.2s" begin="0.9s" repeatCount="indefinite"/>
    </text>
    <text x="30" y="380" font-size="24">🔥
      <animate attributeName="y" values="380;-40" dur="2.3s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0" dur="2.3s" begin="1.2s" repeatCount="indefinite"/>
    </text>
    <text x="360" y="380" font-size="26">🔥
      <animate attributeName="y" values="380;-40" dur="2.5s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0" dur="2.5s" begin="1.5s" repeatCount="indefinite"/>
    </text>
  </g>

  <g fill="#ffdd55">
    <circle cx="60" cy="80" r="2.5"><animate attributeName="opacity" values="0;1;0" dur="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="70" r="2"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="40" r="3"><animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite"/></circle>
  </g>
</svg>
