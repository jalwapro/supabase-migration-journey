<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="pr-bg" cx="50%" cy="55%" r="60%">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#ff6b1a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a0a00" stop-opacity="0"/>
    </radialGradient>
    <filter id="pr-glow"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <circle cx="200" cy="220" r="200" fill="url(#pr-bg)">
    <animate attributeName="r" values="150;220;170" dur="1.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.7" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <g transform="translate(200 220)" filter="url(#pr-glow)">
    <g stroke="#ffd166" fill="none" stroke-width="3" opacity="0.8">
      <circle r="60"><animate attributeName="r" values="60;190" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.6s" repeatCount="indefinite"/></circle>
      <circle r="60"><animate attributeName="r" values="60;190" dur="1.6s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.6s" begin="0.5s" repeatCount="indefinite"/></circle>
    </g>
  </g>
  <text x="200" y="240" font-size="180" text-anchor="middle">🔥
    <animate attributeName="font-size" values="160;190;160" dur="0.6s" repeatCount="indefinite"/>
  </text>
  <text x="200" y="220" font-size="140" text-anchor="middle">🦅
    <animateTransform attributeName="transform" type="translate" values="0 20;0 -20;0 20" dur="1.8s" repeatCount="indefinite"/>
  </text>
  <g font-size="26" text-anchor="middle">
    <text x="80" y="380">🔥<animate attributeName="y" values="380;-40" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="2s" repeatCount="indefinite"/></text>
    <text x="320" y="380">🔥<animate attributeName="y" values="380;-40" dur="2.4s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="2.4s" begin="0.5s" repeatCount="indefinite"/></text>
    <text x="200" y="380">🔥<animate attributeName="y" values="380;-40" dur="2.2s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="2.2s" begin="1s" repeatCount="indefinite"/></text>
  </g>
</svg>
