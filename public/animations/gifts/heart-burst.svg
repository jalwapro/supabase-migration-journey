<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="hbg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4d8f"/>
      <stop offset="100%" stop-color="#a1005a"/>
    </radialGradient>
  </defs>
  <g transform="translate(100 100)">
    <circle r="70" fill="url(#hbg)" opacity="0.25">
      <animate attributeName="r" values="40;90;40" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0;0.5" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <path d="M0 30 C -60 -20 -60 -70 -20 -70 C -5 -70 0 -55 0 -45 C 0 -55 5 -70 20 -70 C 60 -70 60 -20 0 30 Z"
          fill="url(#hbg)" stroke="#fff" stroke-width="2">
      <animateTransform attributeName="transform" type="scale" values="0.9;1.1;0.9" dur="1s" repeatCount="indefinite"/>
    </path>
    <g fill="#ffd6e4">
      <circle cx="-45" cy="-40" r="4"><animate attributeName="cy" values="-40;-90;-40" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="40" cy="-30" r="3"><animate attributeName="cy" values="-30;-80;-30" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" dur="1.8s" repeatCount="indefinite"/></circle>
      <circle cx="20" cy="40" r="3"><animate attributeName="cy" values="40;90;40" dur="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" dur="2.2s" repeatCount="indefinite"/></circle>
    </g>
  </g>
</svg>
