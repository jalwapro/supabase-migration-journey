<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4d6d" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#ff4d6d" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b9d"/>
      <stop offset="100%" stop-color="#c9184a"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#ffb400"/>
    </linearGradient>
  </defs>

  <circle cx="200" cy="210" r="170" fill="url(#glow)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <g font-size="18" text-anchor="middle">
    <text x="90" y="120" fill="#ffd700">✦<animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" repeatCount="indefinite"/></text>
    <text x="310" y="130" fill="#ff4d6d">✧<animate attributeName="opacity" values="1;0.2;1" dur="1.7s" repeatCount="indefinite"/></text>
    <text x="80" y="290" fill="#ffd700">✧<animate attributeName="opacity" values="0.4;1;0.4" dur="1.3s" repeatCount="indefinite"/></text>
    <text x="320" y="300" fill="#ff4d6d">✦<animate attributeName="opacity" values="1;0.4;1" dur="1.6s" repeatCount="indefinite"/></text>
  </g>

  <g transform="translate(200,220)">
    <animateTransform attributeName="transform" type="translate" values="200,220;200,205;200,220" dur="1.6s" repeatCount="indefinite"/>
    <!-- box base -->
    <rect x="-80" y="-40" width="160" height="110" rx="8" fill="url(#box)" stroke="#8b0028" stroke-width="2"/>
    <!-- lid -->
    <rect x="-90" y="-55" width="180" height="30" rx="6" fill="url(#box)" stroke="#8b0028" stroke-width="2"/>
    <!-- vertical ribbon -->
    <rect x="-12" y="-55" width="24" height="125" fill="url(#ribbon)"/>
    <!-- horizontal ribbon -->
    <rect x="-90" y="-42" width="180" height="18" fill="url(#ribbon)"/>
    <!-- bow -->
    <g transform="translate(0,-60)">
      <ellipse cx="-22" cy="0" rx="22" ry="16" fill="url(#ribbon)" stroke="#a67600" stroke-width="1.5"/>
      <ellipse cx="22" cy="0" rx="22" ry="16" fill="url(#ribbon)" stroke="#a67600" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="8" fill="#ffd700" stroke="#a67600" stroke-width="1.5"/>
      <animateTransform attributeName="transform" type="rotate" values="-5 0 0;5 0 0;-5 0 0" dur="1.6s" repeatCount="indefinite" additive="sum"/>
    </g>
  </g>
</svg>
