    <circle cx="100" cy="100" r="34" fill="#14B8A6" opacity="0.9"/>
    <text x="100" y="118" text-anchor="middle" font-size="42" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif">🐉</text>
    <animateTransform attributeName="transform" type="scale" values="1;1.08;1" dur="2.17s" additive="sum" repeatCount="indefinite"/>
