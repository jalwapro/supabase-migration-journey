<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" style="background:transparent">
  <defs>
    <radialGradient id="g69" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#14B8A6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow69" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- outer rotating rays -->
  <g filter="url(#glow69)">
    <g>
      <rect x="99" y="10" width="2" height="30" fill="#FFF" opacity="0.35" transform="rotate(0 100 100)"/><rect x="99" y="10" width="2" height="30" fill="#FFF" opacity="0.35" transform="rotate(30 100 100)"/><rect x="99" y="10" width="2" height="30" fill="#FFF" opacity="0.35" transform="rotate(60 100 100)"/><rect x="99" y="10" width="2" height="30" fill="#FFF" opacity="0.35" transform="rotate(90 100 100)"/><rect x="99" y="10" width="2" height="30" fill="#FFF" opacity="0.35" transform="rotate(120 100 100)"/><rect x="99" y="10" width="2" height="30" fill="#FFF" opacity="0.35" transform="rotate(150 100 100)"/><rect x="99" y="10" width="2" height="30" fill="#FFF" opacity="0.35" transform="rotate(180 100 100)"/><rect x="99" y="10" width="2" height="30" fill="#FFF" opacity="0.35" transform="rotate(210 100 100)"/><rect x="99" y="10" width="2" height="30" fill="#FFF" opacity="0.35" transform="rotate(240 100 100)"/><rect x="99" y="10" width="2" height="30" fill="#FFF" opacity="0.35" transform="rotate(270 100 100)"/><rect x="99" y="10" width="2" height="30" fill="#FFF" opacity="0.35" transform="rotate(300 100 100)"/><rect x="99" y="10" width="2" height="30" fill="#FFF" opacity="0.35" transform="rotate(330 100 100)"/>
      <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="9.0s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- pulsing aura -->
  <circle cx="100" cy="100" r="70" fill="url(#g69)">
    <animate attributeName="r" values="60;74;60" dur="2.17s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2.17s" repeatCount="indefinite"/>
  </circle>

  <!-- orbiting particles -->
  <g>
    <circle cx="178.0" cy="100.0" r="5" fill="#5EEAD4" opacity="0.85"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.17s" begin="0.00s" repeatCount="indefinite"/></circle><circle cx="167.5" cy="139.0" r="6" fill="#5EEAD4" opacity="0.85"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.17s" begin="0.12s" repeatCount="indefinite"/></circle><circle cx="139.0" cy="167.5" r="7" fill="#5EEAD4" opacity="0.85"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.17s" begin="0.24s" repeatCount="indefinite"/></circle><circle cx="100.0" cy="178.0" r="4" fill="#5EEAD4" opacity="0.85"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.17s" begin="0.36s" repeatCount="indefinite"/></circle><circle cx="61.0" cy="167.5" r="5" fill="#5EEAD4" opacity="0.85"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.17s" begin="0.48s" repeatCount="indefinite"/></circle><circle cx="32.5" cy="139.0" r="6" fill="#5EEAD4" opacity="0.85"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.17s" begin="0.60s" repeatCount="indefinite"/></circle><circle cx="22.0" cy="100.0" r="7" fill="#5EEAD4" opacity="0.85"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.17s" begin="0.72s" repeatCount="indefinite"/></circle><circle cx="32.5" cy="61.0" r="4" fill="#5EEAD4" opacity="0.85"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.17s" begin="0.84s" repeatCount="indefinite"/></circle><circle cx="61.0" cy="32.5" r="5" fill="#5EEAD4" opacity="0.85"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.17s" begin="0.96s" repeatCount="indefinite"/></circle><circle cx="100.0" cy="22.0" r="6" fill="#5EEAD4" opacity="0.85"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.17s" begin="1.08s" repeatCount="indefinite"/></circle><circle cx="139.0" cy="32.5" r="7" fill="#5EEAD4" opacity="0.85"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.17s" begin="1.20s" repeatCount="indefinite"/></circle><circle cx="167.5" cy="61.0" r="4" fill="#5EEAD4" opacity="0.85"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.17s" begin="1.32s" repeatCount="indefinite"/></circle>
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="-360 100 100" dur="11.0s" repeatCount="indefinite"/>
  </g>

  <!-- core glyph -->
