<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" style="background:transparent">
  <defs>
    <radialGradient id="g248" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#F97316" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow248" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- outer rotating rays -->
  <g filter="url(#glow248)">
    <g>
      <rect x="99" y="10" width="2" height="30" fill="#FFF" opacity="0.35" transform="rotate(0 100 100)"/><rect x="99" y="10" width="2" height="30" fill="#FFF" opacity="0.35" transform="rotate(30 100 100)"/><rect x="99" y="10" width="2" height="30" fill="#FFF" opacity="0.35" transform="rotate(60 100 100)"/><rect x="99" y="10" width="2" height="30" fill="#FFF" opacity="0.35" transform="rotate(90 100 100)"/><rect x="99" y="10" width="2" height="30" fill="#FFF" opacity="0.35" transform="rotate(120 100 100)"/><rect x="99" y="10" width="2" height="30" fill="#FFF" opacity="0.35" transform="rotate(150 100 100)"/><rect x="99" y="10" width="2" height="30" fill="#FFF" opacity="0.35" transform="rotate(180 100 100)"/><rect x="99" y="10" width="2" height="30" fill="#FFF" opacity="0.35" transform="rotate(210 100 100)"/><rect x="99" y="10" width="2" height="30" fill="#FFF" opacity="0.35" transform="rotate(240 100 100)"/><rect x="99" y="10" width="2" height="30" fill="#FFF" opacity="0.35" transform="rotate(270 100 100)"/><rect x="99" y="10" width="2" height="30" fill="#FFF" opacity="0.35" transform="rotate(300 100 100)"/><rect x="99" y="10" width="2" height="30" fill="#FFF" opacity="0.35" transform="rotate(330 100 100)"/>
      <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="8.0s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- pulsing aura -->
  <circle cx="100" cy="100" r="70" fill="url(#g248)">
    <animate attributeName="r" values="60;74;60" dur="1.64s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.64s" repeatCount="indefinite"/>
  </circle>

  <!-- orbiting particles -->
  <g>
    <circle cx="178.0" cy="100.0" r="4" fill="#FDBA74" opacity="0.85"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.64s" begin="0.00s" repeatCount="indefinite"/></circle><circle cx="165.6" cy="142.2" r="5" fill="#FDBA74" opacity="0.85"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.64s" begin="0.12s" repeatCount="indefinite"/></circle><circle cx="132.4" cy="171.0" r="6" fill="#FDBA74" opacity="0.85"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.64s" begin="0.24s" repeatCount="indefinite"/></circle><circle cx="88.9" cy="177.2" r="7" fill="#FDBA74" opacity="0.85"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.64s" begin="0.36s" repeatCount="indefinite"/></circle><circle cx="48.9" cy="158.9" r="4" fill="#FDBA74" opacity="0.85"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.64s" begin="0.48s" repeatCount="indefinite"/></circle><circle cx="25.2" cy="122.0" r="5" fill="#FDBA74" opacity="0.85"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.64s" begin="0.60s" repeatCount="indefinite"/></circle><circle cx="25.2" cy="78.0" r="6" fill="#FDBA74" opacity="0.85"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.64s" begin="0.72s" repeatCount="indefinite"/></circle><circle cx="48.9" cy="41.1" r="7" fill="#FDBA74" opacity="0.85"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.64s" begin="0.84s" repeatCount="indefinite"/></circle><circle cx="88.9" cy="22.8" r="4" fill="#FDBA74" opacity="0.85"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.64s" begin="0.96s" repeatCount="indefinite"/></circle><circle cx="132.4" cy="29.0" r="5" fill="#FDBA74" opacity="0.85"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.64s" begin="1.08s" repeatCount="indefinite"/></circle><circle cx="165.6" cy="57.8" r="6" fill="#FDBA74" opacity="0.85"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.64s" begin="1.20s" repeatCount="indefinite"/></circle>
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="-360 100 100" dur="10.0s" repeatCount="indefinite"/>
  </g>

  <!-- core glyph -->
  <g>
    <circle cx="100" cy="100" r="34" fill="#F97316" opacity="0.9"/>
    <text x="100" y="118" text-anchor="middle" font-size="42" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif">🎵</text>
    <animateTransform attributeName="transform" type="scale" values="1;1.08;1" dur="1.64s" additive="sum" repeatCount="indefinite"/>
  </g>

  <title>Jalwa Music Anthem</title>
</svg>
