<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="pl-bg" cx="50%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#c8f5c8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c8f5c8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="200" cy="200" r="200" fill="url(#pl-bg)"/>
  <g transform="translate(200 220)">
    <text x="0" y="30" font-size="180" text-anchor="middle">🐼
      <animateTransform attributeName="transform" type="scale" values="1;1.08;1" dur="1.2s" repeatCount="indefinite" additive="sum"/>
    </text>
  </g>
  <g font-size="30" text-anchor="middle">
    <text x="70" y="200">❤️<animate attributeName="y" values="200;80" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="2s" repeatCount="indefinite"/></text>
    <text x="130" y="220">💚<animate attributeName="y" values="220;60" dur="2.4s" begin="0.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="2.4s" begin="0.3s" repeatCount="indefinite"/></text>
    <text x="200" y="210">💗<animate attributeName="y" values="210;70" dur="1.8s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.8s" begin="0.6s" repeatCount="indefinite"/></text>
    <text x="270" y="220">💖<animate attributeName="y" values="220;80" dur="2.2s" begin="0.9s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="2.2s" begin="0.9s" repeatCount="indefinite"/></text>
    <text x="330" y="200">💚<animate attributeName="y" values="200;60" dur="2.1s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="2.1s" begin="0.4s" repeatCount="indefinite"/></text>
  </g>
</svg>
