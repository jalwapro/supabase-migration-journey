<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs><radialGradient id="gpg"><stop offset="0%" stop-color="#7a4bff"/><stop offset="100%" stop-color="#1a0b4d" stop-opacity="0"/></radialGradient></defs>
  <circle cx="100" cy="100" r="90" fill="url(#gpg)"><animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/></circle>
  <g><text x="100" y="125" font-size="90" text-anchor="middle">🪐</text>
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="12s" repeatCount="indefinite"/>
  </g>
  <g fill="#fff">
    <circle cx="30" cy="40" r="1.5"><animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="170" cy="50" r="2"><animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="160" r="1.5"><animate attributeName="opacity" values="0;1;0" dur="2.2s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="20" cy="170" r="2"><animate attributeName="opacity" values="0;1;0" dur="2.6s" begin="1.5s" repeatCount="indefinite"/></circle>
  </g>
</svg>
