<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
<defs><linearGradient id="rd" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ff2ea8" stop-opacity="0"/><stop offset="60%" stop-color="#ff2ea8" stop-opacity=".7"/><stop offset="100%" stop-color="#ffd166" stop-opacity=".9"/></linearGradient>
<radialGradient id="a" cx="50%" cy="60%" r="55%"><stop offset="0%" stop-color="#ff9ac7" stop-opacity=".55"/><stop offset="100%" stop-color="#ff2ea8" stop-opacity="0"/></radialGradient></defs>
<circle cx="200" cy="220" r="200" fill="url(#a)"/>
<rect x="-100" y="210" width="600" height="14" fill="url(#rd)" opacity=".85"><animate attributeName="x" values="-100;-40;-100" dur=".4s" repeatCount="indefinite"/></rect>
<rect x="-100" y="240" width="600" height="8" fill="url(#rd)" opacity=".6"><animate attributeName="x" values="-40;-100;-40" dur=".4s" repeatCount="indefinite"/></rect>
<text x="200" y="230" font-size="180" text-anchor="middle">🏎️<animateTransform attributeName="transform" type="translate" values="-30 0;30 0;-30 0" dur=".8s" repeatCount="indefinite"/></text>
<g font-size="26" text-anchor="middle"><text x="80" y="120">💨<animate attributeName="x" values="80;340" dur=".9s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur=".9s" repeatCount="indefinite"/></text>
<text x="60" y="160">💨<animate attributeName="x" values="60;360" dur="1.1s" begin=".2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.1s" begin=".2s" repeatCount="indefinite"/></text></g></svg>
