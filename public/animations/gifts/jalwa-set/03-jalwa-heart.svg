<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
<defs><radialGradient id="a" cx="50%" cy="50%" r="55%"><stop offset="0%" stop-color="#ff2ea8" stop-opacity=".6"/><stop offset="60%" stop-color="#ffd166" stop-opacity=".2"/><stop offset="100%" stop-color="#ff2ea8" stop-opacity="0"/></radialGradient></defs>
<circle cx="200" cy="200" r="200" fill="url(#a)"><animate attributeName="r" values="140;210;150" dur="1.2s" repeatCount="indefinite"/></circle>
