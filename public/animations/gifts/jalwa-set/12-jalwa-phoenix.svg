<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
<defs><radialGradient id="a" cx="50%" cy="55%" r="60%"><stop offset="0%" stop-color="#ffd166" stop-opacity=".85"/><stop offset="45%" stop-color="#ff2ea8" stop-opacity=".45"/><stop offset="100%" stop-color="#ff2ea8" stop-opacity="0"/></radialGradient><filter id="g"><feGaussianBlur stdDeviation="4"/></filter></defs>
<circle cx="200" cy="220" r="200" fill="url(#a)"><animate attributeName="r" values="150;220;170" dur="1.4s" repeatCount="indefinite"/></circle>
<g transform="translate(200 220)" filter="url(#g)"><g stroke="#ffd166" fill="none" stroke-width="3" opacity=".85"><circle r="60"><animate attributeName="r" values="60;190" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.6s" repeatCount="indefinite"/></circle><circle r="60"><animate attributeName="r" values="60;190" dur="1.6s" begin=".5s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.6s" begin=".5s" repeatCount="indefinite"/></circle></g></g>
<text x="200" y="240" font-size="170" text-anchor="middle">🔥<animate attributeName="font-size" values="150;190;150" dur=".6s" repeatCount="indefinite"/></text>
<text x="200" y="220" font-size="130" text-anchor="middle">🦅<animateTransform attributeName="transform" type="translate" values="0 20;0 -20;0 20" dur="1.8s" repeatCount="indefinite"/></text></svg>
