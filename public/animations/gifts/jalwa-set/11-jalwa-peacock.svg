<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
<defs><radialGradient id="a" cx="50%" cy="50%" r="55%"><stop offset="0%" stop-color="#ff9ac7" stop-opacity=".6"/><stop offset="60%" stop-color="#ffd166" stop-opacity=".2"/><stop offset="100%" stop-color="#ff2ea8" stop-opacity="0"/></radialGradient></defs>
<circle cx="200" cy="200" r="200" fill="url(#a)"/>
<g transform="translate(200 220)"><g><animateTransform attributeName="transform" type="rotate" values="-10;10;-10" dur="2.4s" repeatCount="indefinite"/>
<g fill="none" stroke="#ffd166" stroke-width="3" opacity=".7"><circle r="130"/><circle r="110" stroke="#ff2ea8"/><circle r="90"/></g></g>
<text x="0" y="35" font-size="180" text-anchor="middle">🦚<animateTransform attributeName="transform" type="scale" values=".95;1.05;.95" dur="1.8s" repeatCount="indefinite" additive="sum"/></text></g>
<g fill="#ffd166" font-size="18" text-anchor="middle"><text x="70" y="120">✨<animate attributeName="opacity" values="0;1;0" dur="1.2s" repeatCount="indefinite"/></text><text x="330" y="120">✨<animate attributeName="opacity" values="1;0;1" dur="1.4s" repeatCount="indefinite"/></text></g></svg>
