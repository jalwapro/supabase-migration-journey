<ellipse rx="140" ry="34" fill="none" stroke="#ff2ea8" stroke-width="2" opacity=".7" transform="rotate(45)"/>
<ellipse rx="110" ry="26" fill="none" stroke="#fff9c9" stroke-width="2" opacity=".7" transform="rotate(90)"/></g>
<text x="0" y="20" font-size="120" text-anchor="middle">🪐<animateTransform attributeName="transform" type="rotate" values="0;-360" dur="12s" repeatCount="indefinite"/></text>
