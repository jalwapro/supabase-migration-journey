<defs><radialGradient id="a" cx="50%" cy="50%" r="55%"><stop offset="0%" stop-color="#ff9ac7" stop-opacity=".55"/><stop offset="100%" stop-color="#ff2ea8" stop-opacity="0"/></radialGradient></defs>
<circle cx="200" cy="200" r="200" fill="url(#a)"/>
<g font-size="30" text-anchor="middle" fill="#ffd166">
