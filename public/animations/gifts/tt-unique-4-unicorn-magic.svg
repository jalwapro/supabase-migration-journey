<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="um-bg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#e0aaff" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#a0e7ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a0e7ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="200" cy="200" r="200" fill="url(#um-bg)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <g transform="translate(200 200)">
    <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
      <g stroke="#e0aaff" stroke-width="3" fill="none" opacity="0.7">
        <circle r="120"/>
        <circle r="150" stroke="#a0e7ff" stroke-dasharray="6 8"/>
      </g>
    </g>
    <text x="0" y="30" font-size="150" text-anchor="middle">🦄
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -12;0 0" dur="1.4s" repeatCount="indefinite"/>
    </text>
  </g>
  <g font-size="22" text-anchor="middle">
    <text x="70"  y="90" fill="#ff9ac7">✨<animate attributeName="opacity" values="0;1;0" dur="1.2s" repeatCount="indefinite"/></text>
    <text x="330" y="110" fill="#a0e7ff">✨<animate attributeName="opacity" values="1;0;1" dur="1.4s" repeatCount="indefinite"/></text>
    <text x="90"  y="320" fill="#e0aaff">✨<animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite"/></text>
    <text x="310" y="310" fill="#ffd166">🌟<animate attributeName="opacity" values="1;0;1" dur="1.6s" repeatCount="indefinite"/></text>
    <text x="200" y="60"  fill="#ffd166">🌟<animate attributeName="opacity" values="0;1;0" dur="1.1s" repeatCount="indefinite"/></text>
  </g>
</svg>
