<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="sh-bg" cx="50%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#ffd0e8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffd0e8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="200" cy="200" r="200" fill="url(#sh-bg)"/>
  <g transform="translate(200 210)">
    <text x="-70" y="20" font-size="120" text-anchor="middle">🦢
      <animateTransform attributeName="transform" type="translate" values="-40 0;-10 0;-40 0" dur="2s" repeatCount="indefinite"/>
    </text>
    <text x="70" y="20" font-size="120" text-anchor="middle" transform="scale(-1 1)">🦢
      <animateTransform attributeName="transform" type="translate" values="40 0;10 0;40 0" dur="2s" repeatCount="indefinite"/>
    </text>
    <text x="0" y="-50" font-size="80" text-anchor="middle">❤️
      <animate attributeName="font-size" values="70;100;70" dur="1.2s" repeatCount="indefinite"/>
    </text>
  </g>
  <g font-size="20" text-anchor="middle">
    <text x="80" y="80" fill="#ff4d8f">💕<animate attributeName="y" values="80;40;80" dur="2s" repeatCount="indefinite"/></text>
    <text x="320" y="90" fill="#ff4d8f">💕<animate attributeName="y" values="90;50;90" dur="2.2s" repeatCount="indefinite"/></text>
    <text x="60" y="330" fill="#ff4d8f">💕<animate attributeName="y" values="330;290;330" dur="1.8s" repeatCount="indefinite"/></text>
    <text x="340" y="320" fill="#ff4d8f">💕<animate attributeName="y" values="320;280;320" dur="2.4s" repeatCount="indefinite"/></text>
  </g>
</svg>
