<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
<defs>
<radialGradient id="glow" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#facc15" stop-opacity="0.95"/>
<stop offset="55%" stop-color="#facc15" stop-opacity="0.28"/>
<stop offset="100%" stop-color="#000" stop-opacity="0"/>
</radialGradient>
<radialGradient id="glow2" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#fff" stop-opacity="0.35"/>
<stop offset="100%" stop-color="#fff" stop-opacity="0"/>
</radialGradient>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
<feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
<feOffset dx="0" dy="6" result="off"/>
<feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
<feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<circle cx="200" cy="200" r="180" fill="url(#glow)">
<animate attributeName="opacity" values="0.55;1;0.55" dur="1.8s" repeatCount="indefinite"/>
</circle>
<circle cx="200" cy="200" r="120" fill="url(#glow2)">
<animate attributeName="r" values="100;140;100" dur="2.4s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0.6;0.1;0.6" dur="2.4s" repeatCount="indefinite"/>
</circle>
<g font-size="22" text-anchor="middle" font-family="Arial">
<text x="80" y="110" fill="#ffd700">✦<animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" repeatCount="indefinite"/></text>
<text x="320" y="120" fill="#ff4d6d">✧<animate attributeName="opacity" values="1;0.2;1" dur="1.7s" repeatCount="indefinite"/></text>
<text x="90" y="310" fill="#ffd700">✧<animate attributeName="opacity" values="0.4;1;0.4" dur="1.3s" repeatCount="indefinite"/></text>
<text x="310" y="320" fill="#ff4d6d">✦<animate attributeName="opacity" values="1;0.4;1" dur="1.6s" repeatCount="indefinite"/></text>
</g>
<g filter="url(#shadow)">
<animateTransform attributeName="transform" type="translate" values="0,4;0,-10;0,4" dur="1.8s" repeatCount="indefinite"/>
<g><animateTransform attributeName="transform" type="rotate" values="0 200 200;360 200 200" dur="8s" repeatCount="indefinite"/><ellipse cx="200" cy="120" rx="20" ry="45" fill="#fbbf24" stroke="#b45309" stroke-width="2" transform="rotate(0 200 200)"/><ellipse cx="200" cy="120" rx="20" ry="45" fill="#fbbf24" stroke="#b45309" stroke-width="2" transform="rotate(30 200 200)"/><ellipse cx="200" cy="120" rx="20" ry="45" fill="#fbbf24" stroke="#b45309" stroke-width="2" transform="rotate(60 200 200)"/><ellipse cx="200" cy="120" rx="20" ry="45" fill="#fbbf24" stroke="#b45309" stroke-width="2" transform="rotate(90 200 200)"/><ellipse cx="200" cy="120" rx="20" ry="45" fill="#fbbf24" stroke="#b45309" stroke-width="2" transform="rotate(120 200 200)"/><ellipse cx="200" cy="120" rx="20" ry="45" fill="#fbbf24" stroke="#b45309" stroke-width="2" transform="rotate(150 200 200)"/><ellipse cx="200" cy="120" rx="20" ry="45" fill="#fbbf24" stroke="#b45309" stroke-width="2" transform="rotate(180 200 200)"/><ellipse cx="200" cy="120" rx="20" ry="45" fill="#fbbf24" stroke="#b45309" stroke-width="2" transform="rotate(210 200 200)"/><ellipse cx="200" cy="120" rx="20" ry="45" fill="#fbbf24" stroke="#b45309" stroke-width="2" transform="rotate(240 200 200)"/><ellipse cx="200" cy="120" rx="20" ry="45" fill="#fbbf24" stroke="#b45309" stroke-width="2" transform="rotate(270 200 200)"/><ellipse cx="200" cy="120" rx="20" ry="45" fill="#fbbf24" stroke="#b45309" stroke-width="2" transform="rotate(300 200 200)"/><ellipse cx="200" cy="120" rx="20" ry="45" fill="#fbbf24" stroke="#b45309" stroke-width="2" transform="rotate(330 200 200)"/></g><circle cx="200" cy="200" r="45" fill="#78350f" stroke="#451a03" stroke-width="3"/><circle cx="190" cy="195" r="5" fill="#050505"/><circle cx="215" cy="205" r="5" fill="#050505"/><circle cx="200" cy="215" r="5" fill="#050505"/>
</g>
</svg>