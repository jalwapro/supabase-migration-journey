<animateTransform attributeName="transform" type="translate" values="0,0;0,-14;0,0" dur="1.6s" repeatCount="indefinite"/>
<g><rect x="195" y="200" width="10" height="140" rx="3" fill="#1f2937" transform="rotate(-25 200 270)"/><rect x="195" y="200" width="10" height="18" rx="2" fill="#fbbf24" transform="rotate(-25 200 270)"/><g transform="translate(150,150)"><polygon points="0,-50 15,-15 50,-15 22,10 32,45 0,25 -32,45 -22,10 -50,-15 -15,-15" fill="#fde68a" stroke="#f59e0b" stroke-width="3"/><animateTransform attributeName="transform" type="rotate" values="0 0 0;360 0 0" dur="6s" repeatCount="indefinite" additive="sum"/></g></g>
