<g filter="url(#shadow)">
<animateTransform attributeName="transform" type="translate" values="0,4;0,-10;0,4" dur="1.8s" repeatCount="indefinite"/>
<defs><radialGradient id="pet" cx="50%" cy="40%" r="70%"><stop offset="0" stop-color="#fca5a5"/><stop offset="50%" stop-color="#dc2626"/><stop offset="100%" stop-color="#7f1d1d"/></radialGradient></defs><path d="M198 320 Q 195 240 202 175" stroke="#166534" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M200 250 Q 165 240 148 215 Q 155 195 175 200 Q 190 210 200 250" fill="#16a34a" stroke="#14532d" stroke-width="1.5"/><path d="M200 260 Q 235 250 252 225 Q 245 205 225 210 Q 210 220 200 260" fill="#22c55e" stroke="#14532d" stroke-width="1.5"/><circle cx="200" cy="160" r="52" fill="url(#pet)" stroke="#7f1d1d" stroke-width="2"/><path d="M200 115 Q 165 135 168 175 Q 200 155 200 115" fill="#991b1b" opacity="0.85"/><path d="M200 115 Q 235 135 232 175 Q 200 155 200 115" fill="#b91c1c" opacity="0.85"/><ellipse cx="200" cy="165" rx="22" ry="16" fill="#7f1d1d"/><ellipse cx="195" cy="158" rx="8" ry="5" fill="#450a0a"/>
