<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
<defs>
  <radialGradient id="halo" cx="50%" cy="50%" r="55%">
    <stop offset="0%" stop-color="#ffd166" stop-opacity="0.85"/>
    <stop offset="45%" stop-color="#ffd166" stop-opacity="0.28"/>
    <stop offset="100%" stop-color="#ffd166" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="core" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>
  <filter id="neon" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="6" result="b1"/>
    <feFlood flood-color="#ffd166" flood-opacity="0.95"/>
    <feComposite in2="b1" operator="in" result="glow1"/>
    <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="b2"/>
    <feFlood flood-color="#ff2ea8" flood-opacity="0.9"/>
    <feComposite in2="b2" operator="in" result="glow2"/>
    <feMerge>
      <feMergeNode in="glow1"/>
      <feMergeNode in="glow2"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="chrome">
    <feGaussianBlur stdDeviation="1.2"/>
  </filter>
</defs>

<!-- pulsing neon halo -->
<circle cx="200" cy="200" r="170" fill="url(#halo)">
  <animate attributeName="opacity" values="0.55;1;0.55" dur="1.6s" repeatCount="indefinite"/>
  <animate attributeName="r" values="150;185;150" dur="1.6s" repeatCount="indefinite"/>
</circle>

<!-- rotating dashed neon ring -->
<g transform="translate(200 200)">
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/>
    <circle r="150" fill="none" stroke="#ffd166" stroke-width="3" stroke-dasharray="10 12" opacity="0.75"/>
    <circle r="130" fill="none" stroke="#ff2ea8" stroke-width="2" stroke-dasharray="4 10" opacity="0.6"/>
  </g>
</g>

<!-- inner sticker plate -->
<g transform="translate(200 200)">
  <circle r="112" fill="#0a0033" opacity="0.35"/>
  <circle r="112" fill="none" stroke="#ff2ea8" stroke-width="4" opacity="0.9"/>
  <circle r="112" fill="url(#core)"/>
</g>

<!-- orbital sparks -->
<g fill="#ffd166" font-size="20" text-anchor="middle">
  <text x="60" y="90">✦<animate attributeName="opacity" values="0.2;1;0.2" dur="1.3s" repeatCount="indefinite"/></text>
  <text x="340" y="100" fill="#ff2ea8">✧<animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/></text>
  <text x="70" y="330">✧<animate attributeName="opacity" values="0.3;1;0.3" dur="1.1s" repeatCount="indefinite"/></text>
  <text x="330" y="325" fill="#ff2ea8">✦<animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite"/></text>
  <text x="200" y="55">✦<animate attributeName="opacity" values="0.3;1;0.3" dur="1.7s" repeatCount="indefinite"/></text>
</g>

<!-- centerpiece emoji with neon halo -->
<g transform="translate(200 210)" filter="url(#neon)">
  <text x="0" y="30" font-size="150" text-anchor="middle" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif">🏮
    <animate attributeName="font-size" values="140;168;140" dur="1s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="-4;4;-4" dur="1.8s" repeatCount="indefinite"/>
  </text>
</g>
</svg>
