<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
<defs>
<radialGradient id="glow" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
<stop offset="60%" stop-color="#fbbf24" stop-opacity="0.25"/>
<stop offset="100%" stop-color="#000" stop-opacity="0"/>
</radialGradient>
</defs>
<circle cx="200" cy="200" r="170" fill="url(#glow)">
<animate attributeName="opacity" values="0.5;1;0.5" dur="1.8s" repeatCount="indefinite"/>
</circle>
<g font-size="22" text-anchor="middle" font-family="Arial">
<text x="80" y="110" fill="#ffd700">✦<animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" repeatCount="indefinite"/></text>
<text x="320" y="120" fill="#ff4d6d">✧<animate attributeName="opacity" values="1;0.2;1" dur="1.7s" repeatCount="indefinite"/></text>
<text x="90" y="310" fill="#ffd700">✧<animate attributeName="opacity" values="0.4;1;0.4" dur="1.3s" repeatCount="indefinite"/></text>
<text x="310" y="320" fill="#ff4d6d">✦<animate attributeName="opacity" values="1;0.4;1" dur="1.6s" repeatCount="indefinite"/></text>
</g>
<g>
<animateTransform attributeName="transform" type="translate" values="0,0;0,-14;0,0" dur="1.6s" repeatCount="indefinite"/>
<g><ellipse cx="200" cy="250" rx="65" ry="60" fill="none" stroke="#fbbf24" stroke-width="18"/><ellipse cx="200" cy="250" rx="65" ry="60" fill="none" stroke="#f59e0b" stroke-width="4"/><polygon points="200,140 175,180 200,210 225,180" fill="#93c5fd" stroke="#3b82f6" stroke-width="2"/><polygon points="200,140 175,180 200,175" fill="#bfdbfe"/><polygon points="200,140 225,180 200,175" fill="#60a5fa"/></g>
</g>
</svg>