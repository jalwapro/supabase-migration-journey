<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="g" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#b8f5c9"/><stop offset="100%" stop-color="#b8f5c9" stop-opacity="0"/></radialGradient>
  </defs>
  <circle cx="100" cy="100" r="80" fill="url(#g)"><animate attributeName="r" values="55;95;55" dur="2s" repeatCount="indefinite"/></circle>
  <g><text x="100" y="120" font-size="90" text-anchor="middle">🐼</text>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="2s" repeatCount="indefinite"/>
  </g>
  <g fill="#fff">
    <circle cx="40" cy="40" r="3"><animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="60" r="2"><animate attributeName="opacity" values="0;1;0" dur="1.2s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="170" cy="150" r="3"><animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="30" cy="160" r="2"><animate attributeName="opacity" values="0;1;0" dur="1.4s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="100" cy="30" r="2"><animate attributeName="opacity" values="1;0;1" dur="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="100" cy="180" r="2"><animate attributeName="opacity" values="0;1;0" dur="1.7s" begin="0.5s" repeatCount="indefinite"/></circle>
  </g>
</svg>
