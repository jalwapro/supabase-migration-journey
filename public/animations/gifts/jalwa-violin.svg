<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="g1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6ec7" stop-opacity="1"/>
      <stop offset="45%" stop-color="#ff6ec7" stop-opacity="0.55"/>
      <stop offset="80%" stop-color="#7b5cff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#7b5cff" stop-opacity="0"/>
      <stop offset="85%" stop-color="#7b5cff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7b5cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="b1"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  
  <circle cx="200" cy="200" r="180" fill="url(#g1)"/>
  <g transform="translate(200 200)">
    <circle r="140" fill="none" stroke="#ff6ec7" stroke-width="2" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
    </circle>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
      <circle cx="140" cy="0" r="6" fill="#7b5cff"/>
      <circle cx="-140" cy="0" r="6" fill="#ff6ec7"/>
      <circle cx="0" cy="140" r="5" fill="#7b5cff"/>
      <circle cx="0" cy="-140" r="5" fill="#ff6ec7"/>
    </g>
  </g>
  
  
  
  <text x="200" y="245" font-size="190" text-anchor="middle" dominant-baseline="middle">🎂
    <animateTransform attributeName="transform" type="scale" values="1;1.08;1" dur="1.6s" repeatCount="indefinite" additive="sum"/>
    <animate attributeName="y" values="245;235;245" dur="1.6s" repeatCount="indefinite"/>
  </text>
</svg>