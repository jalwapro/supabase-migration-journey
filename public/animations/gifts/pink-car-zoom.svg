<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <g stroke="#ff69d4" stroke-width="3" opacity="0.6">
    <line x1="0" y1="80" x2="60" y2="80"><animate attributeName="x1" values="-40;200" dur="0.8s" repeatCount="indefinite"/><animate attributeName="x2" values="20;260" dur="0.8s" repeatCount="indefinite"/></line>
    <line x1="0" y1="130" x2="60" y2="130"><animate attributeName="x1" values="-40;200" dur="0.6s" begin="0.2s" repeatCount="indefinite"/><animate attributeName="x2" values="20;260" dur="0.6s" begin="0.2s" repeatCount="indefinite"/></line>
    <line x1="0" y1="105" x2="60" y2="105"><animate attributeName="x1" values="-40;200" dur="0.7s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="x2" values="20;260" dur="0.7s" begin="0.4s" repeatCount="indefinite"/></line>
  </g>
  <g><text x="100" y="120" font-size="90" text-anchor="middle">🏎️</text>
    <animateTransform attributeName="transform" type="translate" values="-30 0;30 0;-30 0" dur="2s" repeatCount="indefinite"/>
  </g>
</svg>
