<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="rc-aura" cx="50%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#ffb3d1" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#ff4d94" stop-opacity="0.35"/>
      <stop offset="80%" stop-color="#c084fc" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rc-heart" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff0f6"/>
      <stop offset="55%" stop-color="#ff2e78"/>
      <stop offset="100%" stop-color="#a3126b"/>
    </radialGradient>
    <filter id="rc-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Pulsing love aura -->
  <circle cx="200" cy="210" r="180" fill="url(#rc-aura)">
    <animate attributeName="r" values="150;190;150" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.55;1;0.55" dur="2.6s" repeatCount="indefinite"/>
  </circle>

  <!-- Rotating dashed love ring -->
  <g transform="translate(200 210)">
    <circle r="150" fill="none" stroke="#ff4d94" stroke-width="2" stroke-dasharray="6 10" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle r="120" fill="none" stroke="#ffd166" stroke-width="1.5" stroke-dasharray="3 7" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="10s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Floating hearts -->
  <g font-size="26" text-anchor="middle" filter="url(#rc-glow)">
    <text x="80" y="330" fill="#ff4d94">💗
      <animate attributeName="y" values="330;120;80" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="320" y="340" fill="#ffb3d1">💖
      <animate attributeName="y" values="340;140;80" dur="4.6s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="4.6s" begin="0.5s" repeatCount="indefinite"/>
    </text>
    <text x="140" y="350" fill="#ff2e78">💕
      <animate attributeName="y" values="350;150;90" dur="3.8s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="3.8s" begin="1s" repeatCount="indefinite"/>
    </text>
    <text x="270" y="350" fill="#ffd166">💘
      <animate attributeName="y" values="350;140;80" dur="4.2s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="4.2s" begin="1.5s" repeatCount="indefinite"/>
    </text>
    <text x="200" y="360" fill="#ff4d94">💞
      <animate attributeName="y" values="360;160;90" dur="4.4s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="4.4s" begin="2s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Big heart behind the couple -->
  <g transform="translate(200 220)" opacity="0.85">
    <path d="M0,40 C-70,-30 -110,20 -60,70 C-30,100 0,120 0,120 C0,120 30,100 60,70 C110,20 70,-30 0,40 Z"
          fill="url(#rc-heart)" filter="url(#rc-glow)">
      <animateTransform attributeName="transform" type="scale" values="0.9;1.05;0.9" dur="1.4s" repeatCount="indefinite" additive="sum"/>
    </path>
  </g>

  <!-- Couple emoji -->
  <text x="200" y="255" font-size="170" text-anchor="middle" dominant-baseline="middle">💑
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="2.2s" repeatCount="indefinite"/>
  </text>

  <!-- Sparkle particles -->
  <g fill="#fff0f6">
    <circle cx="70" cy="90" r="2.5"><animate attributeName="opacity" values="0;1;0" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="110" r="3"><animate attributeName="opacity" values="1;0;1" dur="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="220" r="2"><animate attributeName="opacity" values="0;1;0" dur="1.6s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="230" r="2.5"><animate attributeName="opacity" values="0;1;0" dur="1.9s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="60" r="2.5"><animate attributeName="opacity" values="0;1;0" dur="1.4s" begin="0.2s" repeatCount="indefinite"/></circle>
  </g>
</svg>
