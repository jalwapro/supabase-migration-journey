<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <g fill="#ff8ac5">
    <text x="40" y="70" font-size="16">🌸<animate attributeName="y" values="80;20" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="3s" repeatCount="indefinite"/></text>
    <text x="160" y="80" font-size="14">🌸<animate attributeName="y" values="90;10" dur="2.5s" begin="0.7s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="2.5s" begin="0.7s" repeatCount="indefinite"/></text>
    <text x="30" y="150" font-size="18">🌸<animate attributeName="y" values="160;40" dur="3.2s" begin="1.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="3.2s" begin="1.4s" repeatCount="indefinite"/></text>
  </g>
  <g><text x="100" y="125" font-size="90" text-anchor="middle">🐱</text>
    <animateTransform attributeName="transform" type="translate" values="0 -5;0 5;0 -5" dur="2s" repeatCount="indefinite"/>
  </g>
</svg>
