<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="cy-bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#a0e7ff" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#5b2ecc" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#050014" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="200" cy="200" r="200" fill="url(#cy-bg)"/>
  <g fill="#fff">
    <circle cx="50"  cy="60"  r="2"><animate attributeName="opacity" values="0;1;0" dur="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="90"  r="1.5"><animate attributeName="opacity" values="1;0;1" dur="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="70"  r="2"><animate attributeName="opacity" values="0;1;0" dur="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="290" cy="120" r="1.8"><animate attributeName="opacity" values="1;0;1" dur="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="60"  cy="180" r="1.5"><animate attributeName="opacity" values="0;1;0" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="360" cy="200" r="2"><animate attributeName="opacity" values="1;0;1" dur="1.3s" repeatCount="indefinite"/></circle>
  </g>
  <g transform="translate(200 220)">
    <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
      <ellipse rx="150" ry="40" fill="none" stroke="#e0aaff" stroke-width="2" opacity="0.7"/>
      <ellipse rx="130" ry="34" fill="none" stroke="#a0e7ff" stroke-width="2" opacity="0.6" transform="rotate(45)"/>
    </g>
    <text x="0" y="30" font-size="60" text-anchor="middle">🪐
      <animateTransform attributeName="transform" type="rotate" values="0;-360" dur="10s" repeatCount="indefinite"/>
    </text>
  </g>
  <text x="200" y="290" font-size="120" text-anchor="middle">🛥️
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -12;0 0" dur="2s" repeatCount="indefinite"/>
  </text>
  <g font-size="20" text-anchor="middle">
    <text x="70" y="330" fill="#7ee8ff">〰️<animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite"/></text>
    <text x="330" y="330" fill="#7ee8ff">〰️<animate attributeName="opacity" values="1;0;1" dur="1.7s" repeatCount="indefinite"/></text>
  </g>
</svg>
