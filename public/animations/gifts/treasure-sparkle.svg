<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs><radialGradient id="tg"><stop offset="0%" stop-color="#ffe680"/><stop offset="100%" stop-color="#ffb700" stop-opacity="0"/></radialGradient></defs>
  <circle cx="100" cy="100" r="80" fill="url(#tg)"><animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite"/></circle>
  <text x="100" y="125" font-size="90" text-anchor="middle">💰</text>
  <g fill="#ffd700">
    <text x="50" y="50" font-size="18">✦<animate attributeName="opacity" values="0;1;0" dur="1.2s" repeatCount="indefinite"/></text>
    <text x="150" y="60" font-size="14">✦<animate attributeName="opacity" values="0;1;0" dur="1.4s" begin="0.4s" repeatCount="indefinite"/></text>
    <text x="160" y="150" font-size="20">✦<animate attributeName="opacity" values="0;1;0" dur="1.6s" begin="0.8s" repeatCount="indefinite"/></text>
    <text x="40" y="160" font-size="16">✦<animate attributeName="opacity" values="0;1;0" dur="1.3s" begin="0.2s" repeatCount="indefinite"/></text>
  </g>
</svg>
