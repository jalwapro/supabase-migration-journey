<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="gs" cx="50%" cy="50%"><stop offset="0%" stop-color="#fff"/><stop offset="30%" stop-color="#c084fc"/><stop offset="70%" stop-color="#4c1d95"/><stop offset="100%" stop-color="#050014"/></radialGradient>
  </defs>
  <circle cx="100" cy="100" r="98" fill="url(#gs)"/>
  <g transform="translate(100 100)">
    <g><animateTransform attributeName="transform" type="rotate" values="0;360" dur="10s" repeatCount="indefinite"/>
      <ellipse rx="80" ry="20" fill="none" stroke="#f5d0fe" stroke-width="2" opacity="0.6"/>
      <ellipse rx="60" ry="14" transform="rotate(30)" fill="none" stroke="#e9d5ff" stroke-width="1.5" opacity="0.5"/>
      <ellipse rx="40" ry="8" transform="rotate(60)" fill="none" stroke="#fff" stroke-width="1" opacity="0.7"/>
    </g>
    <circle r="8" fill="#fff"><animate attributeName="r" values="6;10;6" dur="2s" repeatCount="indefinite"/></circle>
    <g fill="#fff">
      <circle cx="-70" cy="-40" r="1.5"><animate attributeName="opacity" values="0;1;0" dur="1.4s" repeatCount="indefinite"/></circle>
      <circle cx="60" cy="-60" r="1"><animate attributeName="opacity" values="1;0;1" dur="1.7s" repeatCount="indefinite"/></circle>
      <circle cx="70" cy="50" r="1.5"><animate attributeName="opacity" values="0;1;0" dur="1.9s" repeatCount="indefinite"/></circle>
      <circle cx="-60" cy="70" r="1"><animate attributeName="opacity" values="1;0;1" dur="2.1s" repeatCount="indefinite"/></circle>
    </g>
  </g>
</svg>
