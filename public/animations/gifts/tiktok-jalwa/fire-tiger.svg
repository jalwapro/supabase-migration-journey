<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
<defs>
  <radialGradient id="ft-bg" cx="50%" cy="55%" r="60%">
    <stop offset="0%" stop-color="#ffd166" stop-opacity=".8"/>
    <stop offset="45%" stop-color="#ff6a00" stop-opacity=".45"/>
    <stop offset="100%" stop-color="#7a1a00" stop-opacity="0"/>
  </radialGradient>
  <filter id="ft-glow"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<circle cx="200" cy="220" r="200" fill="url(#ft-bg)"><animate attributeName="r" values="160;220;170" dur="1.2s" repeatCount="indefinite"/></circle>
<g filter="url(#ft-glow)" font-size="40" text-anchor="middle">
  <text x="80" y="340" fill="#ff6a00">🔥<animate attributeName="y" values="360;290;360" dur=".9s" repeatCount="indefinite"/><animate attributeName="font-size" values="34;46;34" dur=".9s" repeatCount="indefinite"/></text>
  <text x="140" y="340">🔥<animate attributeName="y" values="360;280;360" dur="1.1s" repeatCount="indefinite"/></text>
  <text x="200" y="340">🔥<animate attributeName="y" values="360;270;360" dur=".8s" repeatCount="indefinite"/><animate attributeName="font-size" values="36;50;36" dur=".8s" repeatCount="indefinite"/></text>
  <text x="260" y="340">🔥<animate attributeName="y" values="360;285;360" dur="1s" repeatCount="indefinite"/></text>
  <text x="320" y="340">🔥<animate attributeName="y" values="360;295;360" dur="1.2s" repeatCount="indefinite"/></text>
</g>
<g transform="translate(200 210)">
  <g stroke="#ffd166" fill="none" stroke-width="3" opacity=".8">
    <circle r="60"><animate attributeName="r" values="60;180" dur="1.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.4s" repeatCount="indefinite"/></circle>
    <circle r="60"><animate attributeName="r" values="60;180" dur="1.4s" begin=".7s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.4s" begin=".7s" repeatCount="indefinite"/></circle>
  </g>
  <text x="0" y="30" font-size="180" text-anchor="middle">🐯
    <animateTransform attributeName="transform" type="scale" values=".95;1.12;.95" dur=".7s" repeatCount="indefinite"/>
  </text>
</g>
</svg>
