<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
<defs>
  <radialGradient id="nh-bg" cx="50%" cy="50%" r="55%">
    <stop offset="0%" stop-color="#ff2ea8" stop-opacity=".7"/>
    <stop offset="60%" stop-color="#7b5cff" stop-opacity=".25"/>
    <stop offset="100%" stop-color="#7b5cff" stop-opacity="0"/>
  </radialGradient>
  <filter id="nh-glow"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<circle cx="200" cy="200" r="200" fill="url(#nh-bg)"><animate attributeName="r" values="150;220;150" dur="1.2s" repeatCount="indefinite"/></circle>
<g transform="translate(200 200)" filter="url(#nh-glow)">
  <g stroke="#ff2ea8" fill="none" stroke-width="4">
    <circle r="40"><animate attributeName="r" values="40;190" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle r="40" stroke="#ffd166"><animate attributeName="r" values="40;190" dur="1.6s" begin=".4s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.6s" begin=".4s" repeatCount="indefinite"/></circle>
    <circle r="40" stroke="#7b5cff"><animate attributeName="r" values="40;190" dur="1.6s" begin=".8s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.6s" begin=".8s" repeatCount="indefinite"/></circle>
  </g>
</g>
<g transform="translate(200 210)">
  <text x="0" y="20" font-size="180" text-anchor="middle" filter="url(#nh-glow)" fill="#ff2ea8">💖</text>
  <text x="0" y="20" font-size="180" text-anchor="middle">💖<animate attributeName="font-size" values="160;200;160" dur=".7s" repeatCount="indefinite"/></text>
</g>
<g fill="#ffd166" font-size="22" text-anchor="middle">
  <text x="80" y="90">✨<animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite"/></text>
  <text x="320" y="100">✨<animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></text>
  <text x="70" y="310">✨<animate attributeName="opacity" values="0;1;0" dur=".9s" repeatCount="indefinite"/></text>
  <text x="330" y="300">✨<animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/></text>
</g>
</svg>
