<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
<defs>
  <radialGradient id="sc-bg" cx="50%" cy="50%" r="55%">
    <stop offset="0%" stop-color="#7b5cff" stop-opacity=".55"/>
    <stop offset="100%" stop-color="#0a0033" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="sc-tail" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#ffd166" stop-opacity="0"/>
    <stop offset="100%" stop-color="#ffd166" stop-opacity=".9"/>
  </linearGradient>
</defs>
<circle cx="200" cy="200" r="200" fill="url(#sc-bg)"/>
<g>
  <g><animateTransform attributeName="transform" type="translate" values="-100,-100;500,500" dur="1.4s" repeatCount="indefinite"/>
    <rect x="-4" y="-4" width="80" height="8" fill="url(#sc-tail)" transform="rotate(45)"/>
    <text x="0" y="8" font-size="36" text-anchor="middle" fill="#ffd166">⭐</text>
  </g>
  <g><animateTransform attributeName="transform" type="translate" values="-150,-50;450,550" dur="1.7s" repeatCount="indefinite"/>
    <rect x="-4" y="-4" width="70" height="6" fill="url(#sc-tail)" transform="rotate(45)"/>
    <text x="0" y="6" font-size="28" text-anchor="middle" fill="#ffd166">⭐</text>
  </g>
  <g><animateTransform attributeName="transform" type="translate" values="-80,-180;480,380" dur="1.2s" repeatCount="indefinite"/>
    <rect x="-4" y="-4" width="60" height="6" fill="url(#sc-tail)" transform="rotate(45)"/>
    <text x="0" y="6" font-size="24" text-anchor="middle" fill="#ffffff">⭐</text>
  </g>
  <g><animateTransform attributeName="transform" type="translate" values="-200,-30;500,470" dur="2s" repeatCount="indefinite"/>
    <rect x="-4" y="-4" width="90" height="8" fill="url(#sc-tail)" transform="rotate(45)"/>
    <text x="0" y="8" font-size="40" text-anchor="middle" fill="#ffd166">🌟</text>
  </g>
</g>
<g transform="translate(200 210)">
  <text x="0" y="30" font-size="170" text-anchor="middle">🌟
    <animateTransform attributeName="transform" type="rotate" values="-15;15;-15" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="font-size" values="150;190;150" dur="1.2s" repeatCount="indefinite"/>
  </text>
</g>
</svg>
