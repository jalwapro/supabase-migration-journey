<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
<defs>
  <radialGradient id="cb-bg" cx="50%" cy="50%" r="55%">
    <stop offset="0%" stop-color="#7b5cff" stop-opacity=".7"/>
    <stop offset="50%" stop-color="#ff2ea8" stop-opacity=".3"/>
    <stop offset="100%" stop-color="#0a0033" stop-opacity="0"/>
  </radialGradient>
</defs>
<circle cx="200" cy="200" r="200" fill="url(#cb-bg)"><animate attributeName="opacity" values=".6;1;.6" dur="2s" repeatCount="indefinite"/></circle>
<g fill="#ffffff" opacity=".8">
  <circle cx="60" cy="80" r="1.6"><animate attributeName="opacity" values="0;1;0" dur="1.4s" repeatCount="indefinite"/></circle>
  <circle cx="320" cy="70" r="2"><animate attributeName="opacity" values="1;0;1" dur="1.6s" repeatCount="indefinite"/></circle>
  <circle cx="90" cy="330" r="1.8"><animate attributeName="opacity" values="0;1;0" dur="1.2s" repeatCount="indefinite"/></circle>
  <circle cx="340" cy="320" r="2"><animate attributeName="opacity" values="1;0;1" dur="1.8s" repeatCount="indefinite"/></circle>
  <circle cx="200" cy="50" r="1.6"><animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite"/></circle>
</g>
<g font-size="46" text-anchor="middle">
  <text x="80" y="130">🦋<animate attributeName="y" values="130;80;130" dur="2.4s" repeatCount="indefinite"/><animate attributeName="x" values="80;120;80" dur="2.8s" repeatCount="indefinite"/></text>
  <text x="320" y="140">🦋<animate attributeName="y" values="140;90;140" dur="2.2s" repeatCount="indefinite"/><animate attributeName="x" values="320;280;320" dur="2.6s" repeatCount="indefinite"/></text>
  <text x="100" y="310">🦋<animate attributeName="y" values="310;260;310" dur="2s" repeatCount="indefinite"/></text>
  <text x="310" y="300">🦋<animate attributeName="y" values="300;250;300" dur="2.6s" repeatCount="indefinite"/></text>
</g>
<g transform="translate(200 210)">
  <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    <circle r="90" fill="none" stroke="#ffd166" stroke-width="2" stroke-dasharray="4 8" opacity=".7"/>
  </g>
  <text x="0" y="30" font-size="150" text-anchor="middle">🦋
    <animate attributeName="font-size" values="140;170;140" dur="1s" repeatCount="indefinite"/>
  </text>
</g>
</svg>
