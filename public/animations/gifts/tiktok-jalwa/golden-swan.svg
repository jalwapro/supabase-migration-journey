<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
<defs>
  <radialGradient id="gs-bg" cx="50%" cy="55%" r="55%">
    <stop offset="0%" stop-color="#ffd166" stop-opacity=".7"/>
    <stop offset="60%" stop-color="#ff8ec4" stop-opacity=".2"/>
    <stop offset="100%" stop-color="#ff8ec4" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="gs-water" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#7be3ff" stop-opacity=".4"/>
    <stop offset="100%" stop-color="#3b6dff" stop-opacity="0"/>
  </linearGradient>
</defs>
<circle cx="200" cy="200" r="200" fill="url(#gs-bg)"><animate attributeName="opacity" values=".6;1;.6" dur="2s" repeatCount="indefinite"/></circle>
<ellipse cx="200" cy="320" rx="180" ry="30" fill="url(#gs-water)"><animate attributeName="rx" values="170;195;170" dur="2.4s" repeatCount="indefinite"/></ellipse>
<g transform="translate(200 220)">
  <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
    <g fill="none" stroke="#ffd166" stroke-width="2" opacity=".7" stroke-dasharray="6 6">
      <circle r="150"/><circle r="120"/>
    </g>
  </g>
  <text x="0" y="35" font-size="180" text-anchor="middle">🦢
    <animateTransform attributeName="transform" type="translate" values="-10 0;10 0;-10 0" dur="3s" repeatCount="indefinite"/>
  </text>
</g>
<g fill="#ffd166" font-size="22" text-anchor="middle">
  <text x="100" y="120">✨<animate attributeName="opacity" values="0;1;0" dur="1.4s" repeatCount="indefinite"/></text>
  <text x="300" y="130">✨<animate attributeName="opacity" values="1;0;1" dur="1.6s" repeatCount="indefinite"/></text>
</g>
</svg>
