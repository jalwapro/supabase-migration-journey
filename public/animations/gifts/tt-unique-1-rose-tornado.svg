<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="rt-bg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ff3d7f" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#ff3d7f" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ff3d7f" stop-opacity="0"/>
    </radialGradient>
    <filter id="rt-glow"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>
  <circle cx="200" cy="200" r="200" fill="url(#rt-bg)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <g transform="translate(200 200)">
    <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3s" repeatCount="indefinite"/>
      <text x="0" y="-150" font-size="34" text-anchor="middle">🌹</text>
      <text x="130" y="-70" font-size="30" text-anchor="middle">🌹</text>
      <text x="130" y="70" font-size="34" text-anchor="middle">🌹</text>
      <text x="0" y="150" font-size="30" text-anchor="middle">🌹</text>
      <text x="-130" y="70" font-size="34" text-anchor="middle">🌹</text>
      <text x="-130" y="-70" font-size="30" text-anchor="middle">🌹</text>
    </g>
    <g><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="2s" repeatCount="indefinite"/>
      <text x="0" y="-90" font-size="26" text-anchor="middle" opacity="0.9">🌸</text>
      <text x="80" y="30" font-size="26" text-anchor="middle" opacity="0.9">🌸</text>
      <text x="-80" y="30" font-size="26" text-anchor="middle" opacity="0.9">🌸</text>
    </g>
    <text x="0" y="30" font-size="130" text-anchor="middle" filter="url(#rt-glow)">🌹
      <animate attributeName="font-size" values="120;150;120" dur="1s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
