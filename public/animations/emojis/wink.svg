<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#e28d00" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e28d00" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g transform="translate(100 100)">
    <circle r="80" fill="url(#halo)">
      <animate attributeName="r" values="55;85;55" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <g transform="translate(-60 -40)"><path d="M0 -6 L2 -2 L6 0 L2 2 L0 6 L-2 2 L-6 0 L-2 -2 Z" fill="#fff"><animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="0.0s" repeatCount="indefinite"/></path></g>
    <g transform="translate(55 -30)"><path d="M0 -6 L2 -2 L6 0 L2 2 L0 6 L-2 2 L-6 0 L-2 -2 Z" fill="#fff"><animate attributeName="opacity" values="0;1;0" dur="2.0s" begin="0.2s" repeatCount="indefinite"/></path></g>
    <g transform="translate(-40 55)"><path d="M0 -6 L2 -2 L6 0 L2 2 L0 6 L-2 2 L-6 0 L-2 -2 Z" fill="#fff"><animate attributeName="opacity" values="0;1;0" dur="2.2s" begin="0.4s" repeatCount="indefinite"/></path></g>
    <g transform="translate(50 50)"><path d="M0 -6 L2 -2 L6 0 L2 2 L0 6 L-2 2 L-6 0 L-2 -2 Z" fill="#fff"><animate attributeName="opacity" values="0;1;0" dur="1.6s" begin="0.6s" repeatCount="indefinite"/></path></g>
    <g transform="translate(0 -70)"><path d="M0 -6 L2 -2 L6 0 L2 2 L0 6 L-2 2 L-6 0 L-2 -2 Z" fill="#fff"><animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></path></g>
    <g transform="translate(-70 10)"><path d="M0 -6 L2 -2 L6 0 L2 2 L0 6 L-2 2 L-6 0 L-2 -2 Z" fill="#fff"><animate attributeName="opacity" values="0;1;0" dur="2.0s" begin="1.0s" repeatCount="indefinite"/></path></g>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="4s" repeatCount="indefinite" additive="sum"/>
      <text x="0" y="0" text-anchor="middle" dominant-baseline="central"
            font-size="110" font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif"
            style="filter: drop-shadow(0 4px 8px rgba(0,0,0,0.35));">😉</text>
    </g>
  </g>
</svg>
