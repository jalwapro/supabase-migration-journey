name: Android Push Notification Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: bun install

      - name: Build web app
        run: bun run build

      - name: Prepare existing Capacitor Android project
        shell: bash
        run: |
          mkdir -p .native-build
          if [ -f android/app/google-services.json ]; then
            cp android/app/google-services.json .native-build/google-services.json
          fi
          test -f android/app/src/main/AndroidManifest.xml
          if [ -f .native-build/google-services.json ]; then
            cp .native-build/google-services.json android/app/google-services.json
          fi

      - name: Sync Capacitor and enforce Android permissions
        run: |
          mkdir -p android/app/src/main/assets
          npx cap sync android
          node scripts/ensure-android-permissions.mjs

      - name: Verify native Firebase configuration
        shell: bash
        run: |
          test -f android/app/google-services.json
          grep -q 'app.lovable.jalwa' android/app/google-services.json
          grep -q 'jalwa_default' android/app/src/main/AndroidManifest.xml
          grep -q 'POST_NOTIFICATIONS' android/app/src/main/AndroidManifest.xml
          grep -q 'ACCESS_COARSE_LOCATION' android/app/src/main/AndroidManifest.xml
          grep -q 'ACCESS_FINE_LOCATION' android/app/src/main/AndroidManifest.xml
          grep -q 'RECORD_AUDIO' android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Print APK signing certificate fingerprints
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jalwa-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
