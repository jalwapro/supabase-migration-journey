name: Voice-only Home Cleanup

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  voice-only-home:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make Home Voice Room only
        shell: python
        run: |
          from pathlib import Path
          p = Path("src/routes/index.tsx")
          s = p.read_text(encoding="utf-8")
          replacements = [
              ('type TabKey = "video" | "voice" | "pk";\nconst TABS: { key: TabKey; label: string; Icon: typeof Video }[] = [\n  { key: "video", label: "Video", Icon: Video },\n  { key: "voice", label: "Voice", Icon: Mic },\n  { key: "pk", label: "PK Battle", Icon: Swords },\n];',
               'type TabKey = "voice";\nconst TABS: { key: TabKey; label: string; Icon: typeof Mic }[] = [\n  { key: "voice", label: "Voice Room", Icon: Mic },\n];'),
              ('const [tab, setTab] = useState<TabKey>("video");', 'const [tab, setTab] = useState<TabKey>("voice");'),
              ('          <div className="relative grid grid-cols-3 gap-1 rounded-full border border-white/10 bg-white/5 p-1 backdrop-blur">', '          <div className="relative grid grid-cols-1 gap-1 rounded-full border border-white/10 bg-white/5 p-1 backdrop-blur">'),
              ('className="absolute inset-y-1 left-1 w-[calc((100%-0.5rem)/3)] rounded-full', 'className="absolute inset-y-1 left-1 w-[calc(100%-0.5rem)] rounded-full'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f"Expected source pattern not found: {old[:80]}")
              s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")

      - name: Commit Home cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/index.tsx
          if git diff --cached --quiet; then
            echo "No Home changes required"
            exit 0
          fi
          git commit -m "fix(home): show only Voice Room"
          git push