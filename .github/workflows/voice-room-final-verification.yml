name: Voice Room Final Verification

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify critical files
        run: |
          test -f src/hooks/useZegoRoom.ts
          test -f src/components/GiftSheet.tsx
          test -f src/components/room/GiftAnimationPlayer.tsx
          test -f src/components/room/HostMusicPlayer.tsx
          test -f src/components/room/RoomGamesSheet.tsx
          test -f db/migrations/0321_voice_room_host_seat_count_rpc.sql
      - name: Production build
        run: bun run build
