name: Voice Room Hardening Retry

on:
  workflow_run:
    workflows: ["Voice Room Production Hardening"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify Voice Room hardening state
        shell: bash
        run: |
          test -f src/components/voice-room/VoiceRoomScreen.tsx
          test -f src/components/voice-room/SeatGrid.tsx
          test -f src/components/room/HostRoomMoreSheet.tsx
          grep -RIn "update_voice_room_seat_count" db/migrations src/routes/room.\$roomId.tsx

      - name: Production build
        run: bun run build
