name: Install Jalwa private chat UI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/jalwa-private-chat-install.yml

permissions:
  contents: write

jobs:
  install:
    if: github.event.head_commit.message == 'Install Jalwa private chat UI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install private chat launcher
        env:
          PROFILE_SPOTLIGHT_B64: "UEhTUk9GSUxF" 
        run: |
          echo "$PROFILE_SPOTLIGHT_B64" | base64 --decode > src/components/room/ProfileSpotlight.tsx
          rm -f .github/workflows/jalwa-private-chat-install.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/room/ProfileSpotlight.tsx .github/workflows/jalwa-private-chat-install.yml
          git commit -m "Add Jalwa private chat popup to voice room"
          git push
