name: Voice Room Complete Wiring

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    if: ${{ !contains(github.event.head_commit.message, '[skip-voice-room-complete]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Wire host controls and remove duplicate local sheets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/room.$roomId.tsx')
          s = p.read_text()
          if 'HostRoomMoreSheet' not in s:
              s = s.replace('import { HostMusicPlayer } from "@/components/room/HostMusicPlayer";', 'import { HostMusicPlayer } from "@/components/room/HostMusicPlayer";\nimport { HostRoomMoreSheet } from "@/components/room/HostRoomMoreSheet";')
          marker = '  const [pendingInvite, setPendingInvite] = useState<'
          if 'const [hostMoreOpen, setHostMoreOpen]' not in s:
              s = s.replace(marker, '  const [hostMoreOpen, setHostMoreOpen] = useState(false);\n\n' + marker, 1)
          old = 'onOpenMore={() => setVideoSettingsOpen(true)}'
          new = 'onOpenMore={() => { if (isHost) setHostMoreOpen(true); else setVideoSettingsOpen(true); }}'
          s = s.replace(old, new, 1)
          render_marker = '<JalwaPrivateChat open={privateChatOpen} onClose={() => setPrivateChatOpen(false)} />'
          if 'HostRoomMoreSheet' in s and '<HostRoomMoreSheet ' not in s:
              sheet = '''<HostRoomMoreSheet\nopen={hostMoreOpen}\nonClose={() => setHostMoreOpen(false)}\nseatCount={r.seat_count}\nmaxSeats={20}\nonSeats={async (next) => {\n  if (!isHost) return;\n  const occupied = members.filter((m) => m.seat_index != null).length;\n  if (next < occupied) { toast.error(`Cannot reduce seats below ${occupied} occupied seats`); return; }\n  const { error } = await supabase.from("live_rooms").update({ seat_count: next }).eq("id", roomId).eq("host_id", user?.id ?? "");\n  if (error) { toast.error(error.message); return; }\n  setHostMoreOpen(false);\n  await room.refetch();\n}}\nonMusic={() => { setHostMoreOpen(false); setMusicOpen(true); }}\nonSettings={() => { setHostMoreOpen(false); setVideoSettingsOpen(true); }}\nonInvite={() => { setHostMoreOpen(false); setInviteOpen(true); }}\nonRanking={() => { setHostMoreOpen(false); void navigate({ to: "/rank" }); }}\n/>\n\n'''
              s = s.replace(render_marker, sheet + render_marker, 1)
          p.write_text(s)

          # VoiceRoomScreen must delegate sheets to the route so there is one real source of truth.
          v = Path('src/components/voice-room/VoiceRoomScreen.tsx')
          vs = v.read_text()
          vs = vs.replace('import { GiftSheet, type GiftReceiver } from "@/components/GiftSheet";\nimport { RoomGamesSheet } from "@/components/room/RoomGamesSheet";\n', '')
          vs = vs.replace('import { useMemo, useState } from "react";', 'import { useState } from "react";')
          vs = vs.replace('  const [giftOpen, setGiftOpen] = useState(false);\n  const [gamesOpen, setGamesOpen] = useState(false);\n  const [moreOpen, setMoreOpen] = useState(false);\n', '')
          vs = vs.replace('  const receivers = useMemo<GiftReceiver[]>(() => {', '  /* route owns GiftSheet/GameSheet/More so realtime state is shared */\n  const receivers = useMemo<GiftReceiver[]>(() => {') if 'receivers' in vs else vs
          # Remove local sheet render block if present.
          import re
          vs = re.sub(r'\n\s*<GiftSheet[\\s\\S]*?\n\s*</main>;', '\n  </main>;', vs, count=1) if '<GiftSheet' in vs else vs
          vs = vs.replace('onClick={() => setMoreOpen(false)}', 'onClick={onOpenMore}')
          # Keep buttons directly wired to parent handlers.
          vs = vs.replace('onClick={tap(openGifts)}', 'onClick={tap(onOpenGift)}')
          vs = vs.replace('onClick={tap(openGames)}', 'onClick={tap(onOpenGames)}')
          vs = vs.replace('onClick={tap(openMore)}', 'onClick={tap(onOpenMore)}')
          v.write_text(vs)
          PY
      - name: Build verification
        run: npm run build
      - name: Commit generated wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/room.\$roomId.tsx src/components/voice-room/VoiceRoomScreen.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "wire real voice room controls and host more [skip-voice-room-complete]"
          git push
