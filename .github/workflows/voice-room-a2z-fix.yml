name: Voice Room A2Z Fix

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify required Voice Room integrations
        run: |
          test -f src/components/voice-room/VoiceRoomScreen.tsx
          test -f src/components/room/GiftAnimationPlayer.tsx
          test -f src/components/room/HostMusicPlayer.tsx
          test -f src/hooks/useZegoRoom.ts
          grep -q 'GiftSheet' src/components/voice-room/VoiceRoomScreen.tsx
          grep -q 'RoomGamesSheet' src/components/voice-room/VoiceRoomScreen.tsx
          bun run build
