name: Voice Room A2Z Fix

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify-and-fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip-voice-a2z]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; elif [ -f pnpm-lock.yaml ]; then corepack enable && pnpm install --frozen-lockfile; elif [ -f yarn.lock ]; then corepack enable && yarn install --frozen-lockfile; else npm install; fi
      - name: Harden mobile voice-room shell and verify required integrations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/voice-room/VoiceRoomScreen.tsx')
          s = p.read_text(encoding='utf-8')

          # Mobile-first: never constrain the live room to a desktop-sized canvas.
          s = s.replace('max-w-[480px]', 'max-w-none sm:max-w-[480px]', 1)
          # Remove expensive backdrop blur from the permanent bottom bar; sheets can still use blur.
          s = s.replace('bg-black/90 px-2.5 py-2 pb-[calc(0.5rem+env(safe-area-inset-bottom))] backdrop-blur-md pointer-events-auto', 'bg-black/95 px-2.5 py-2 pb-[calc(0.5rem+env(safe-area-inset-bottom))] pointer-events-auto', 1)
          # Promote compositor-friendly touch behavior and prevent browser gestures from dragging the room.
          s = s.replace('touch-manipulation mx-auto flex h-[100dvh]', 'touch-manipulation overscroll-none mx-auto flex h-[100dvh]', 1)
          # Keep modal overlays above the room without creating a full-screen permanent stacking layer.
          s = s.replace('className="fixed inset-0 z-[2147483000] bg-black/60"', 'className="fixed inset-0 z-[2147483000] bg-black/60 touch-none"', 1)
          p.write_text(s, encoding='utf-8')

          required = {
            'src/components/voice-room/VoiceRoomScreen.tsx': ['GiftSheet','RoomGamesSheet','onToggleMic','onOpenMore'],
            'src/components/room/GiftAnimationPlayer.tsx': [],
            'src/components/room/HostMusicPlayer.tsx': [],
            'src/hooks/useZegoRoom.ts': [],
          }
          missing=[]
          for fn, terms in required.items():
            if not Path(fn).exists(): missing.append(fn)
            else:
              text=Path(fn).read_text(encoding='utf-8')
              for t in terms:
                if t not in text: missing.append(f'{fn}: {t}')
          if missing:
            raise SystemExit('Missing voice-room integration: ' + ', '.join(missing))
          PY
      - name: Build
        run: npm run build
      - name: Commit verified mobile/runtime hardening
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/voice-room/VoiceRoomScreen.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'harden voice room mobile runtime performance [skip-voice-a2z]'
          git push
