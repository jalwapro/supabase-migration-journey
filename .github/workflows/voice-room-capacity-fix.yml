name: Voice Room Capacity Fix
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip-capacity-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire secure seat capacity RPC and responsive grid
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/voice-room/VoiceRoomScreen.tsx')
          s=p.read_text()
          s=s.replace('room: RoomState; roomId: string; roomCode:', 'room: RoomState; roomId: string; seatCount?: number; roomCode:')
          s=s.replace('room, roomId, roomCode, onlineCount', 'room, roomId, seatCount, roomCode, onlineCount')
          s=s.replace('<SeatGrid seats={room.seats} host=', '<SeatGrid seats={room.seats} seatCount={seatCount} host=')
          p.write_text(s)

          p=Path('src/components/voice-room/SeatGrid.tsx')
          s=p.read_text()
          s=s.replace('interface SeatGridProps { seats: RoomSeat[];', 'interface SeatGridProps { seats: RoomSeat[]; seatCount?: number;')
          s=s.replace('export function SeatGrid({ seats, host, micOn,', 'export function SeatGrid({ seats, seatCount, host, micOn,')
          s=s.replace('  const byIndex = new Map(seats.map((s) => [s.index, s]));', '  const capacity = Math.max(2, Math.min(20, Math.floor(Number(seatCount ?? 20))));\n  const visibleSeats = seats.filter((s) => s.index > 0 && s.index < capacity);\n  const byIndex = new Map(visibleSeats.map((s) => [s.index, s]));')
          s=s.replace('<button onClick={onClick}', '<button type="button" onClick={onClick}')
          s=s.replace('<button onClick={onToggleMic}', '<button type="button" onClick={onToggleMic}')
          p.write_text(s)

          p=Path('src/routes/room.$roomId.tsx')
          s=p.read_text()
          old='''const { error } = await supabase.from("live_rooms").update({ seat_count: safe }).eq("id", roomId).eq("host_id", user.id);'''
          new='''const { data: savedCount, error } = await supabase.rpc("update_voice_room_seat_count", { _room_id: roomId, _seat_count: safe });'''
          if old in s:
              s=s.replace(old,new,1)
              s=s.replace('''await room.refetch();\n    toast.success(`Room now has ${safe} voice seats`);''','''await room.refetch();\n    toast.success(`Room now has ${Number(savedCount ?? safe)} voice seats`);''',1)
          s=s.replace('''seatCount={Number(r.seat_count ?? 0)}''','''seatCount={Number(r?.seat_count ?? 8)}''')
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/voice-room/VoiceRoomScreen.tsx src/components/voice-room/SeatGrid.tsx 'src/routes/room.$roomId.tsx'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix realtime voice room seat capacity [skip-capacity-fix]'
          git push
      - name: Build verification
        run: |
          test -f db/migrations/0321_voice_room_host_seat_count_rpc.sql
          grep -q 'seatCount' src/components/voice-room/VoiceRoomScreen.tsx
          grep -q 'update_voice_room_seat_count' 'src/routes/room.$roomId.tsx'
