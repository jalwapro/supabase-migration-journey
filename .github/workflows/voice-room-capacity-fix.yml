name: Voice Room Capacity Fix

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify capacity implementation
        run: |
          test -f db/migrations/0321_voice_room_host_seat_count_rpc.sql
          grep -q "seatCount" src/components/voice-room/VoiceRoomScreen.tsx
          grep -q "update_voice_room_seat_count" 'src/routes/room.$roomId.tsx'
          bun run build
