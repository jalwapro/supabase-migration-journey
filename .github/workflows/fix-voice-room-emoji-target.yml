name: Fix Voice Room Emoji Target

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch emoji target routing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/room.$roomId.tsx')
          s = p.read_text()
          old = '''onSendEmoji={(e) => { const target = members.find((m) => m.seat_index != null && m.user_id !== user?.id)?.seat_index ?? 0; void sendEmoji(e.emoji, target, e.clip_path); }}'''
          new = '''onSendEmoji={(e, targetSeatIndex) => {\n            const target = targetSeatIndex ?? null;\n            if (target == null) {\n              toast.info("Pehle kisi user ki DP/seat select karein");\n              return;\n            }\n            const targetMember = members.find((m) => m.seat_index === target && m.user_id !== user?.id);\n            if (!targetMember) {\n              toast.info("Sirf occupied user ki DP par emoji bhej sakte hain");\n              return;\n            }\n            void sendEmoji(e.emoji, target, e.clip_path);\n          }}'''
          if old not in s:
              raise SystemExit('Expected emoji callback not found; aborting without changes')
          p.write_text(s.replace(old, new, 1))

          p = Path('src/components/voice-room/VoiceRoomScreen.tsx')
          s = p.read_text()
          old = '''                <button type="button" onClick={() => setSelectedTargetSeat(null)} className={cn("px-3 py-1.5 rounded-lg text-[10px] font-bold whitespace-nowrap transition-all border", selectedTargetSeat === null ? "text-white border-transparent shadow-md" : "bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700")} style={selectedTargetSeat === null ? { background: primaryThemeColor, color: "#000" } : {}}>General Chat</button>\n'''
          if old in s:
              s = s.replace(old, '', 1)
          p.write_text(s)
          PY

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/room.$roomId.tsx src/components/voice-room/VoiceRoomScreen.tsx
          git rm .github/workflows/fix-voice-room-emoji-target.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix voice room emoji target routing"
          git push
