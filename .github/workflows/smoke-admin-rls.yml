name: Smoke — Admin RLS

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke-admin-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run admin-gating smoke test
        env:
          ADMIN_EMAIL: ${{ secrets.SMOKE_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
          USER_EMAIL: ${{ secrets.SMOKE_USER_EMAIL }}
          USER_PASSWORD: ${{ secrets.SMOKE_USER_PASSWORD }}
        run: |
          if [ -z "$ADMIN_EMAIL" ] || [ -z "$ADMIN_PASSWORD" ] || [ -z "$USER_EMAIL" ] || [ -z "$USER_PASSWORD" ]; then
            echo "✖ Missing SMOKE_ADMIN_EMAIL / SMOKE_ADMIN_PASSWORD / SMOKE_USER_EMAIL / SMOKE_USER_PASSWORD repo secrets"
            exit 1
          fi
          node scripts/smoke-admin-rls.mjs

  complete-emoji-gifts-fix:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'fix/emoji-small-gifts-complete' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply exact source fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          room = Path('src/routes/room.$roomId.tsx')
          s = room.read_text(encoding='utf-8')
          old = 'onSendEmoji={(e) => { const target = members.find((m) => m.seat_index != null && m.user_id !== user?.id)?.seat_index ?? 0; void sendEmoji(e.emoji, target, e.clip_path); }}'
          new = 'onSendEmoji={(e, targetSeatIndex) => { const target = targetSeatIndex ?? null; if (target == null) { toast.info("Pehle room mein kisi user ki DP/seat select karein"); return; } void sendEmoji(e.emoji, target, e.clip_path); }}'
          if old in s:
              s = s.replace(old, new, 1)
          elif 'onSendEmoji={(e, targetSeatIndex)' not in s:
              raise SystemExit('Expected emoji callback was not found')
          room.write_text(s, encoding='utf-8')

          gift = Path('src/components/GiftSheet.tsx')
          gs = gift.read_text(encoding='utf-8')
          old = 'const visibleGifts=useMemo(()=>[...(gifts.data??[])].filter(g=>tierOf(price(g))===activeTier).sort((a,b)=>price(a)-price(b)),[gifts.data,activeTier]);'
          new = 'const visibleGifts=useMemo(()=>[...(gifts.data??[])].filter(g=>{const p=price(g);return activeTier==="small"?p>=10&&p<=300:tierOf(p)===activeTier}).sort((a,b)=>price(a)-price(b)),[gifts.data,activeTier]);'
          if old in gs:
              gs = gs.replace(old, new, 1)
          elif 'activeTier==="small"?p>=10&&p<=300' not in gs:
              raise SystemExit('Expected small-gift filter was not found')
          gift.write_text(gs, encoding='utf-8')
          PY

          grep -Fq 'onSendEmoji={(e, targetSeatIndex)' 'src/routes/room.$roomId.tsx'
          grep -Fq 'activeTier==="small"?p>=10&&p<=300' 'src/components/GiftSheet.tsx'

      - name: Install dependencies
        run: npm ci

      - name: Build verification
        run: npm run build

      - name: Commit actual source fixes to PR branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'src/routes/room.$roomId.tsx' 'src/components/GiftSheet.tsx'
          if git diff --cached --quiet; then
            echo 'Source fixes already committed.'
            exit 0
          fi
          git commit -m 'fix(voice-room): route emojis to selected user and enforce 10-300 gifts'
          git push origin HEAD:${{ github.head_ref }}
