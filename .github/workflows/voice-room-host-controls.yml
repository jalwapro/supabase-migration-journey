name: Voice Room Host Controls
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  wire:
    if: ${{ !contains(github.event.head_commit.message, '[skip-host-controls]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply host More controls
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/routes/room.$roomId.tsx')
          s=p.read_text()
          if 'import { HostRoomMoreSheet }' not in s:
            s=s.replace('import { HostMusicPlayer } from "@/components/room/HostMusicPlayer";', 'import { HostMusicPlayer } from "@/components/room/HostMusicPlayer";\nimport { HostRoomMoreSheet } from "@/components/room/HostRoomMoreSheet";')
          if 'const [hostMoreOpen, setHostMoreOpen]' not in s:
            s=s.replace('  const [pendingInvite, setPendingInvite] = useState<', '  const [hostMoreOpen, setHostMoreOpen] = useState(false);\n  const [pendingInvite, setPendingInvite] = useState<', 1)
          s=s.replace('onOpenMore={() => setVideoSettingsOpen(true)}', 'onOpenMore={() => { if (isHost) setHostMoreOpen(true); else setVideoSettingsOpen(true); }}', 1)
          marker='<JalwaPrivateChat open={privateChatOpen} onClose={() => setPrivateChatOpen(false)} />'
          if '<HostRoomMoreSheet' not in s:
            sheet='''<HostRoomMoreSheet open={hostMoreOpen} onClose={() => setHostMoreOpen(false)} seatCount={r.seat_count} maxSeats={20} onSeats={async (next) => { if (!isHost) return; const occupied=members.filter((m)=>m.seat_index!=null).length; if(next<occupied){toast.error(`Cannot reduce seats below ${occupied} occupied seats`);return;} const {error}=await supabase.from("live_rooms").update({seat_count:next}).eq("id",roomId).eq("host_id",user?.id??""); if(error){toast.error(error.message);return;} setHostMoreOpen(false); await room.refetch(); }} onMusic={() => {setHostMoreOpen(false);setMusicOpen(true)}} onSettings={() => {setHostMoreOpen(false);setVideoSettingsOpen(true)}} onInvite={() => {setHostMoreOpen(false);setInviteOpen(true)}} onRanking={() => {setHostMoreOpen(false);void navigate({to:"/rank"})}} />\n\n'''
            s=s.replace(marker,sheet+marker,1)
          p.write_text(s)
          PY
      - run: npm run build
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'src/routes/room.$roomId.tsx'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'wire real host more controls [skip-host-controls]'
          git push
