name: Voice Room Production Hardening

on:
  workflow_run:
    workflows: ["Voice Room Host Controls"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harden:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify secure seat RPC
        shell: bash
        run: |
          test -f db/migrations/0321_voice_room_host_seat_count_rpc.sql
          grep -RIn "update_voice_room_seat_count" db/migrations src/routes/room.\$roomId.tsx

      - name: Verify critical Voice Room integrations
        shell: bash
        run: |
          test -f src/hooks/useZegoRoom.ts
          test -f src/hooks/useLiveKitVoiceRoom.ts
          test -f src/routes/api/livekit-token.ts
          test -f src/routes/api/livekit-room.ts
          test -f src/components/GiftSheet.tsx
          test -f src/components/room/GiftAnimationPlayer.tsx
          test -f src/components/room/HostMusicPlayer.tsx
          test -f src/components/room/RoomGamesSheet.tsx
          test -f src/components/voice-room/SeatGrid.tsx
          test -f src/components/voice-room/RoomHeader.tsx
          test -f src/components/room/HostRoomMoreSheet.tsx

      - name: Production build
        run: bun run build
