name: one-time-seat-frame-fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'fix voice room seat dp frames'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch seat frame wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          seat = Path('src/components/voice-room/SeatGrid.tsx')
          s = seat.read_text()
          s = s.replace('import { cn } from "@/lib/utils";', 'import { cn } from "@/lib/utils";\nimport { LevelAvatar } from "@/components/LevelAvatar";')
          s = s.replace('  popularity?: number;\n};', '  popularity?: number;\n  level?: number;\n  ring?: string | null;\n};', 1)
          old_empty = '''function EmptySeatArt({ locked }: { locked: boolean }) {
  return (
    <span className="relative grid h-full w-full place-items-center overflow-hidden rounded-full border-2 border-amber-500 bg-transparent shadow-none">
      <img src={DEFAULT_SEAT_AVATAR} alt="" className="h-full w-full object-cover rounded-full" draggable={false} />
      {locked && <Lock className="absolute h-3.5 w-3.5 text-amber-400 drop-shadow" />}
    </span>
  );
}'''
          new_empty = '''function EmptySeatArt({ locked }: { locked: boolean }) {
  return (
    <span className="relative flex h-full w-full items-center justify-center">
      <LevelAvatar
        src={DEFAULT_SEAT_AVATAR}
        name="Empty seat"
        level={0}
        size="sm"
        showBadge={false}
      />
      {locked && <Lock className="pointer-events-none absolute z-50 h-3.5 w-3.5 text-amber-400 drop-shadow" />}
    </span>
  );
}'''
          if old_empty not in s:
              raise SystemExit('EmptySeatArt block not found')
          s = s.replace(old_empty, new_empty, 1)
          old_avatar = '''          <span className="relative aspect-square w-full max-w-[56px] p-0 flex items-center justify-center my-0.5 bg-transparent">
            <span className={cn("relative block h-full w-full overflow-hidden rounded-full border-2 z-10 shadow-md bg-transparent", speaking ? "border-fuchsia-400 shadow-[0_0_15px_rgba(236,72,153,0.8)]" : "border-amber-400")}>
              <img src={avatar} alt={username} className="h-full w-full object-cover rounded-full" draggable={false} />
              {speaking && <span className="absolute inset-0 rounded-full border-2 border-fuchsia-400 animate-pulse pointer-events-none" />}
            </span>
            {frameUrl && <img src={frameUrl} alt="" className="absolute -inset-3 h-[calc(100%+24px)] w-[calc(100%+24px)] pointer-events-none object-contain z-30" draggable={false} />}
            <span className={cn("absolute bottom-0 right-0 z-40 grid h-4 w-4 place-items-center rounded-full border-2 border-black text-white shadow-md", isMuted ? "bg-red-500" : "bg-emerald-500")}>{isMuted ? <MicOff className="h-2 w-2" /> : <Mic className="h-2 w-2" />}</span>
          </span>'''
          new_avatar = '''          <span className="relative aspect-square w-full max-w-[56px] p-0 flex items-center justify-center my-0.5 bg-transparent">
            <LevelAvatar
              src={avatar}
              name={username}
              level={user?.level ?? 0}
              size="sm"
              showBadge={false}
              frame={frameUrl}
              ring={user?.ring}
              className={speaking ? "ring-2 ring-fuchsia-400 shadow-[0_0_15px_rgba(236,72,153,0.8)]" : ""}
            />
            <span className={cn("absolute bottom-0 right-0 z-40 grid h-4 w-4 place-items-center rounded-full border-2 border-black text-white shadow-md", isMuted ? "bg-red-500" : "bg-emerald-500")}>{isMuted ? <MicOff className="h-2 w-2" /> : <Mic className="h-2 w-2" />}</span>
          </span>'''
          if old_avatar not in s:
              raise SystemExit('occupied avatar block not found')
          s = s.replace(old_avatar, new_avatar, 1)
          seat.write_text(s)

          route = Path('src/routes/room.$roomId.tsx')
          r = route.read_text()
          r = r.replace('user: { username: string | null; avatar: string | null; frame: string | null; vip_level?: number | null } | null;', 'user: { username: string | null; avatar: string | null; frame: string | null; ring?: string | null; vip_level?: number | null } | null;', 1)
          r = r.replace('user: m ? {\n          id: m.user_id,\n          username: m.user?.username ?? "User",\n          avatar: m.user?.avatar ?? null,\n          level: m.user?.vip_level ?? 0,', 'user: m ? {\n          id: m.user_id,\n          username: m.user?.username ?? "User",\n          avatar: m.user?.avatar ?? null,\n          avatar_frame_url: m.user?.frame ?? null,\n          frame_url: m.user?.frame ?? null,\n          ring: m.user?.ring ?? null,\n          level: m.user?.vip_level ?? 0,', 1)
          r = r.replace('user:profiles!room_members_user_id_fkey(username,avatar,frame,vip_level)', 'user:profiles!room_members_user_id_fkey(username,avatar,frame,ring,vip_level)')
          route.write_text(r)
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/voice-room/SeatGrid.tsx 'src/routes/room.$roomId.tsx'
          git diff --cached --quiet || git commit -m 'fix voice room seat dp frames'
          git push
