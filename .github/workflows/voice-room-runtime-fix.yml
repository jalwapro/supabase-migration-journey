name: Voice Room Runtime Fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip-voice-room-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair voice room runtime and touch layer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/room.$roomId.tsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace('const mappedRoomState: RoomState = useMemo(() => {', 'const mappedRoomState: RoomState = (() => {', 1)
          s = s.replace('  }, [r, members, agora.speakingUids, agora.muted, giftPoints, lockedSeats]);\nreturn (', '  })();\nreturn (', 1)
          s = s.replace('const m = members.find(mem => mem.seat_index === seatIndex);', 'const m = members.find(mem => mem.user_id !== r.host_id && mem.seat_index === seatIndex);', 1)
          s = s.replace('className="fixed inset-0 flex flex-col overflow-hidden text-white bg-black"', 'className="fixed inset-0 z-40 flex flex-col overflow-hidden text-white bg-black pointer-events-auto touch-manipulation"', 1)
          p.write_text(s, encoding='utf-8')
          v = Path('src/components/voice-room/VoiceRoomScreen.tsx')
          vs = v.read_text(encoding='utf-8')
          vs = vs.replace('className="relative mx-auto flex h-[100dvh]', 'className="relative z-50 pointer-events-auto touch-manipulation mx-auto flex h-[100dvh]', 1)
          v.write_text(vs, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'src/routes/room.$roomId.tsx' 'src/components/voice-room/VoiceRoomScreen.tsx'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix voice room touch interaction [skip-voice-room-fix]"
          git push
