name: Voice Room Runtime Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'voice room route hook-order fix') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix hook order and host-only seat mapping
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/room.$roomId.tsx')
          s = p.read_text()
          s = s.replace('const mappedRoomState: RoomState = useMemo(() => {', 'const mappedRoomState: RoomState = (() => {', 1)
          old = '''    const roomSeats: RoomSeat[] = Array.from({ length: 20 }, (_, i) => {
      const seatIndex = i + 1;
      const m = members.find(mem => mem.seat_index === seatIndex);
      const isLocked = lockedSeats.includes(seatIndex);'''
          new = '''    const roomSeats: RoomSeat[] = Array.from({ length: 20 }, (_, i) => {
      const seatIndex = i + 1;
      // The host belongs only to the dedicated HostCard. Never mirror the
      // host into a normal audience seat, even if legacy data has seat 0/1.
      const m = members.find(mem => mem.user_id !== r.host_id && mem.seat_index === seatIndex);
      const isLocked = lockedSeats.includes(seatIndex);'''
          if old not in s:
              raise SystemExit('room seat mapping block not found')
          s = s.replace(old, new, 1)
          old_end = '  }, [r, members, agora.speakingUids, agora.muted, giftPoints, lockedSeats]);\nreturn ('
          new_end = '  })();\nreturn ('
          if old_end not in s:
              raise SystemExit('hook dependency terminator not found')
          s = s.replace(old_end, new_end, 1)
          p.write_text(s)
          PY
      - name: Commit route fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/room.$roomId.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix voice room route hook-order fix"
          git push
